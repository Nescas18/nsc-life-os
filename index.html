<script>
/* Link limpo: remove só parâmetros de RASTREAMENTO da barra de endereço, sem redirecionar nem recarregar.
   Preserva o restante da query (ex.: ?code= do Supabase, ?uber=, ?tab=) e o fragmento (#access_token do
   Supabase), então não quebra login, convite nem redirecionamentos. */
(function(){try{
  var u=new URL(location.href),track=["utm_source","utm_medium","utm_campaign","utm_term","utm_content","utm_id","utm_name","fbclid","gclid","gbraid","wbraid","msclkid","igshid","mc_eid","mc_cid","twclid","ttclid","yclid","_hsenc","_hsmi"],chg=false;
  track.forEach(function(k){if(u.searchParams.has(k)){u.searchParams.delete(k);chg=true;}});
  if(chg&&window.history&&history.replaceState){var q=u.searchParams.toString();history.replaceState(null,"",u.pathname+(q?"?"+q:"")+u.hash);}
}catch(e){}})();

<style>

const C=window.NSC_CONFIG;
const mem={};

const loadScript=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('Não foi possível carregar '+src));document.head.appendChild(s)});
/* Supabase opcional: ativado só quando supabaseUrl + supabaseAnonKey estão configurados (ver LEIA-ME). */
const Cloud={on:!!(C.supabaseUrl&&C.supabaseAnonKey),sb:null,
  async init(){if(!this.on)return false;if(this.sb)return true;if(!window.supabase)await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js');this.sb=window.supabase.createClient(C.supabaseUrl,C.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return true},
  async pull(id){const{data,error}=await this.sb.from('lifeos_user_data').select('data,updated_at').eq('user_id',id).maybeSingle();if(error)throw error;return data&&data.data},
  async push(id,doc){const{error}=await this.sb.from('lifeos_user_data').upsert({user_id:id,data:doc,updated_at:new Date().toISOString()});if(error)throw error},
  async publishRank(row){const{error}=await this.sb.from('driver_global_ranking').upsert(row,{onConflict:'user_id'});if(error)throw error},
  async readRanks(f,t){const{data,error}=await this.sb.from('driver_global_ranking').select('user_id,display_name,vehicle,period_start,period_end,revenue,operating_profit,highlighted_app,updated_at').eq('period_start',f).eq('period_end',t).order('operating_profit',{ascending:false}).limit(100);if(error)throw error;return data||[]}
};
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const Auth={
  users(){let u;try{u=JSON.parse(LS.get('nsc_users')||'{}')}catch(e){u={}}return u},
  hash(s){return btoa(unescape(encodeURIComponent(s)))}, // formato antigo: só é aceito para migrar contas existentes
  async kdf(pass,salt){if(!(window.crypto&&crypto.subtle))return null;const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:120000,hash:'SHA-256'},k,256))},

  async check(stored,pass){if(stored&&stored.startsWith('p2$')){const[,salt,h]=stored.split('$');return await this.kdf(pass,salt)===h}return stored===this.hash(pass)},
  async signUp(name,email,pass){
    if(Cloud.on){await Cloud.init();const{data,error}=await Cloud.sb.auth.signUp({email,password:pass,options:{data:{name}}});if(error)throw new Error(cloudErr(error));if(!data.session){const e=new Error('Conta criada. Confirme o e-mail que enviamos e depois entre.');e.info=true;throw e}return{email,name,id:data.user.id}}
    const u=this.users();if(u[email])throw new Error('Este e-mail já está cadastrado.');u[email]={name,pass:await this.mk(pass)};LS.set('nsc_users',JSON.stringify(u));return{email,name}},
  async signIn(email,pass){
    email=String(email||'').trim().toLowerCase();pass=String(pass??'').trim();
    if(Cloud.on){await Cloud.init();const{data,error}=await Cloud.sb.auth.signInWithPassword({email,password:pass});if(error)throw new Error(cloudErr(error));const m=data.user.user_metadata||{};return{email,name:m.name||email.split('@')[0],id:data.user.id}}
    const all=this.users(),u=all[email];if(!u||!await this.check(u.pass,pass))throw new Error('E-mail ou senha incorretos.');

<script>
/* ============ AUTH UI ============ */
function togglePw(b){const i=b.previousElementSibling,s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'🙈':'👁';b.setAttribute('aria-label',s?'Ocultar senha':'Mostrar senha');b.setAttribute('aria-pressed',s)}
function switchTab(mode){
  const l=mode==='login';
  document.getElementById('form-login').style.display=l?'block':'none';
  document.getElementById('form-register').style.display=l?'none':'block';
  document.getElementById('btn-tab-login').classList.toggle('active',l);
  document.getElementById('btn-tab-register').classList.toggle('active',!l);
  const er=document.getElementById('auth-err');er.textContent='';er.classList.remove('info');
}
async function handleAuth(e,mode){
  e.preventDefault();
  const f=new FormData(e.target),err=document.getElementById('auth-err'),b=e.target.querySelector('[type=submit]');
  const email=String(f.get('email')||'').trim().toLowerCase();
  const pass=String(f.get('pass')??'').trim();
  err.textContent='';err.classList.remove('info');b.disabled=true;
  try{
    const u=mode==='login'?await Auth.signIn(email,pass):await Auth.signUp(f.get('name').trim(),email,pass);
    Auth.start(u);enter(u,true,mode==='register');
  }catch(x){err.textContent=x.message||'Não foi possível concluir. Tente novamente.';err.classList.toggle('info',!!x.info)}
  finally{b.disabled=false}
}
async function forgotPw(){const err=document.getElementById('auth-err'),em=document.getElementById('li-email').value.trim().toLowerCase();err.classList.add('info');
  if(Cloud.on&&!em){err.classList.remove('info');err.textContent='Digite seu e-mail no campo acima e clique novamente.';return}
  try{err.textContent=await Auth.reset(em)}catch(x){err.classList.remove('info');err.textContent=x.message}}
/* ============ CENA 3D DO LOGIN (base preservada) ============ */
const container=document.getElementById('canvas-container');
const LOWPOWER=(navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||8)<=2;
const RM=matchMedia('(prefers-reduced-motion:reduce)');
let loginOn=false,loginRaf=0,scene,camera,renderer,planet,particleSystem,particleCount,orbitAngles,orbitSpeed,orbitRadius;
function createParticleTexture(){
  const c=document.createElement('canvas');c.width=c.height=64;
  const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.2,'rgba(220,225,235,.8)');g.addColorStop(.5,'rgba(120,130,150,.3)');g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,64,64);
  const t=new THREE.Texture(c);t.needsUpdate=true;return t;
}
function updateCameraPosition(){
  if(innerWidth>768){camera.position.set(-6,18,38);camera.lookAt(2,0,0)}
  else{camera.position.set(0,18,42);camera.lookAt(0,0,0)}
}
try{
  if(!window.THREE)throw new Error('three.js não carregou');
  scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x050505,0.0012);
  camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,1000);
  updateCameraPosition();
  renderer=new THREE.WebGLRenderer({antialias:!LOWPOWER,alpha:false});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,LOWPOWER?1:2));
  renderer.setClearColor(0x050505,1);
  container.appendChild(renderer.domElement);
  planet=new THREE.Mesh(new THREE.SphereGeometry(3.2,64,64),new THREE.MeshStandardMaterial({color:0x08080a,roughness:.8,metalness:.2}));
  planet.position.set(3,0,0);scene.add(planet);
  scene.add(new THREE.AmbientLight(0xffffff,.2));
  const dirLight=new THREE.DirectionalLight(0xffffff,1.2);dirLight.position.set(10,20,15);scene.add(dirLight);
  particleCount=LOWPOWER?16000:38000;const geometry=new THREE.BufferGeometry();
  const positions=new Float32Array(particleCount*3);orbitAngles=new Float32Array(particleCount);orbitSpeed=new Float32Array(particleCount);orbitRadius=new Float32Array(particleCount);
  const innerRadius=5.5,outerRadius=23;
  for(let i=0;i<particleCount;i++){
    const r=innerRadius+Math.pow(Math.random(),1.8)*(outerRadius-innerRadius),a=Math.random()*Math.PI*2,y=(Math.random()-.5)*(.8*(r/outerRadius));
    positions[i*3]=planet.position.x+Math.cos(a)*r;positions[i*3+1]=y;positions[i*3+2]=planet.position.z+Math.sin(a)*r;
    orbitRadius[i]=r;orbitAngles[i]=a;orbitSpeed[i]=(.005+(1/r)*.04)*(.8+Math.random()*.4);
  }
  geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));
  particleSystem=new THREE.Points(geometry,new THREE.PointsMaterial({size:.45,map:createParticleTexture(),transparent:true,opacity:.85,depthWrite:false,blending:THREE.AdditiveBlending}));
  particleSystem.rotation.z=THREE.MathUtils.degToRad(8);particleSystem.rotation.x=THREE.MathUtils.degToRad(12);
  scene.add(particleSystem);
  loginOn=true;
}catch(e){container.style.background='radial-gradient(circle at 70% 50%,#15151b 0%,#050505 60%)';console.warn('Cena 3D do login indisponível:',e.message)}
let zoomT=0;
function animate(){
  if(!loginOn)return;
  loginRaf=requestAnimationFrame(animate);
  if(document.hidden)return;
  const sp=RM.matches?0:1,p=particleSystem.geometry.attributes.position.array;
  if(sp){for(let i=0;i<particleCount;i++){
    orbitAngles[i]+=orbitSpeed[i]*.6;const r=orbitRadius[i];
    p[i*3]=planet.position.x+Math.cos(orbitAngles[i])*r;p[i*3+2]=planet.position.z+Math.sin(orbitAngles[i])*r;
  }
  particleSystem.geometry.attributes.position.needsUpdate=true;
  planet.rotation.y+=.002;}
  if(zoomT){const k=Math.min(1,(performance.now()-zoomT)/950),e=k*k*(3-2*k);camera.position.lerpVectors(zoomFrom,zoomTo,e);camera.lookAt(planet.position);}
  renderer.render(scene,camera);
}
let zoomFrom,zoomTo;
function loginZoom(){if(!loginOn)return;zoomFrom=camera.position.clone();zoomTo=planet.position.clone().add(new THREE.Vector3(-2,4,11));zoomT=performance.now()}
function stopLogin(){if(!loginOn)return;loginOn=false;cancelAnimationFrame(loginRaf);try{scene.traverse(o=>{o.geometry&&o.geometry.dispose();o.material&&o.material.dispose()});renderer.dispose();renderer.forceContextLoss();renderer.domElement.remove()}catch(e){}}
if(loginOn)animate();
addEventListener('resize',()=>{if(!loginOn)return;camera.aspect=innerWidth/innerHeight;updateCameraPosition();camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

/* ============ MOTOR 3D COMPARTILHADO DO APP ============
   Um único contexto WebGL desenha todas as visualizações (globo, veículo, velocímetro, esfera, anatomia)
   nas áreas dos respectivos elementos. Pausa com a aba oculta, respeita movimento reduzido. */
const G3={r:null,fail:false,views:[],angle:.6,last:0,frame:0,
  init(){if(this.r)return true;if(this.fail)return false;
    try{if(!window.THREE)throw new Error('three.js indisponível');const r=new THREE.WebGLRenderer({antialias:!LOWPOWER,alpha:true,powerPreference:'low-power'});
      r.setPixelRatio(Math.min(devicePixelRatio,LOWPOWER?1:2));r.setSize(innerWidth,innerHeight);r.setScissorTest(true);r.setClearColor(0x000000,0);r.domElement.id='gl';r.domElement.setAttribute('aria-hidden','true');
      if(r.outputEncoding!==undefined)r.outputEncoding=THREE.sRGBEncoding;
      $('#app').appendChild(r.domElement);this.r=r;
      r.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();this.fail=true;this.r=null;this.views.forEach(v=>v.el.isConnected&&G3.fallback(v.el));this.views=[]});
      addEventListener('resize',()=>r.setSize(innerWidth,innerHeight));
      requestAnimationFrame(t=>this.loop(t));return true}
    catch(e){this.fail=true;console.warn('WebGL indisponível:',e.message);return false}},
  fallback(el,msg){el.innerHTML='<div class="st3">'+(msg||'Visualização 3D indisponível neste dispositivo. Todos os dados e cálculos continuam funcionando.')+'</div>'},
  add(el,o={}){if(!el)return null;if(!this.init()){this.fallback(el);return null}
    this.views=this.views.filter(v=>v.el!==el||(this.dispose(v),false));
    const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(o.fov||40,1,.1,100);cam.position.set(...(o.pos||[0,1.6,7]));cam.lookAt(...(o.look||[0,0,0]));
    const v={el,scene:sc,cam,tick:null,w:0,h:0};this.views.push(v);return v},
  dispose(v){v.scene.traverse(o=>{if(o.geometry)o.geometry.dispose();const m=o.material;(Array.isArray(m)?m:m?[m]:[]).forEach(x=>{x.map&&x.map.dispose();x.dispose()})})},
  loop(now){requestAnimationFrame(t=>this.loop(t));const r=this.r;if(!r)return;
    const dt=Math.min(.1,(now-(this.last||now))/1000);this.last=now;
    if(document.hidden)return;const mot=!RM.matches;if(mot)this.angle+=dt*.32;if(LOWPOWER&&(this.frame++&1))return;
    this.views=this.views.filter(v=>v.el.isConnected||(this.dispose(v),false));
    const W=innerWidth,H=innerHeight;r.setScissor(0,0,W,H);r.clear();if(!this.views.length)return;
    const mod=$('#modal.on');if(mod)return;
    const mr=$('main').getBoundingClientRect();
    const t=mot?now/1000:0;
    for(const v of this.views){const b=v.el.getBoundingClientRect();if(b.width<2||b.height<2)continue;
      const l=Math.max(b.left,mr.left),tp=Math.max(b.top,mr.top),rt=Math.min(b.right,mr.right),bt=Math.min(b.bottom,mr.bottom);if(rt<=l||bt<=tp)continue;
      if(v.w!==b.width||v.h!==b.height){v.w=b.width;v.h=b.height;v.cam.aspect=b.width/b.height;v.cam.updateProjectionMatrix()}
      try{v.tick&&v.tick(t,dt,mot)}catch(e){}
      r.setViewport(b.left,H-b.bottom,b.width,b.height);r.setScissor(l,H-bt,rt-l,bt-tp);r.render(v.scene,v.cam)}}
};
/* compatível com a função antiga: mini3d(el, setup) */
function mini3d(el,setup){const v=G3.add(el,{pos:[0,1.6,7]});if(!v)return null;v.tick=setup(v.scene,v.cam)||null;return v}

/* A miniatura 3D do veículo foi removida dos painéis nesta versão: o motor compartilhado agora atende só o globo da aba Hoje. */

function mountGlobe(){

<script>

const cfg=()=>Object.assign({kml:10,price:6,goal:0,kwh:.95,kmkwh:6,loss:10,evShare:50,fuel:'gasolina',gLo:40,gHi:80},db.cfg),hhmm=s=>{const[a,b]=String(s).split(':').map(Number);return a*60+b};

/* ============ ENTRADA NUMÉRICA ============
   Valores em reais aceitam 250 · 250,50 · 250.50 · 1.250,50 · 1,250.50 · "R$ 1.250". */
function parseMoney(s){if(typeof s==='number')return isFinite(s)?Math.round(s*100)/100:NaN;s=String(s??'').replace(/R\$|\s/g,'');if(!s||!/^\d[\d.,]*$/.test(s))return NaN;
  const c=s.includes(','),d=s.includes('.');
  if(c&&d)s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
  else if(c){const p=s.split(',');if(p.length>2)return NaN;s=p.join('.')}
  else if(d){const p=s.split('.');if(p.length>2){if(!p.slice(1).every(x=>x.length===3))return NaN;s=p.join('')}else if(p[1].length===3)s=p.join('')} // 1.250 = mil duzentos e cinquenta
  const v=+s;return isFinite(v)?Math.round(v*100)/100:NaN}
/* números decimais comuns (preço por litro, km, litros): vírgula ou ponto é sempre decimal */
function parseDec(s){if(typeof s==='number')return s;s=String(s??'').trim().replace(/\s/g,'');if(!s)return NaN;if((s.match(/[.,]/g)||[]).length>1)return NaN;const v=+s.replace(',','.');return isFinite(v)?v:NaN}
/* horas: 6 · 6,5 · 6.5 · 6:30 · 6h30 · 6h */
function parseHours(s){s=String(s??'').trim().toLowerCase().replace(/\s/g,'');if(!s)return NaN;let m=s.match(/^(\d{1,2})(?:[:h](\d{1,2})?)?m?(?:in)?$/);if(m&&(s.includes(':')||s.includes('h'))){const h=+m[1],mi=+(m[2]||0);return mi<60?h*60+mi:NaN}const v=parseDec(s);return isFinite(v)?Math.round(v*60):NaN}
/* leituras de hodômetro/km inteiros: 52.340 · 52,340 · 52340 → 52340 (ponto/vírgula seguido de 3 dígitos é milhar) */
function parseOdo(s){s=String(s??'').trim().replace(/\s|km/gi,'');if(!s)return NaN;if(/^\d{1,3}([.,]\d{3})+$/.test(s))return+s.replace(/[.,]/g,'');const v=parseDec(s);return isFinite(v)?Math.round(v):NaN}
const fmtH=m=>{m=Math.round(m);return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')};

/* ============ JORNADA DIÁRIA ============
   Formato novo (v:2): {d, app, min, periods:[{s,e}], trips|null, km|null, kmSrc, odoIni, odoFim, notes}.
   Formato antigo: {d, app, km, trips, start, end, pause}. Ambos são lidos pelos acessores abaixo. */
function unionPeriods(ps){const iv=(ps||[]).filter(p=>p&&p.s&&p.e&&p.s!==p.e).map(p=>{const s=hhmm(p.s);let e=hhmm(p.e);if(e<=s)e+=1440;return[s,e]}).sort((a,b)=>a[0]-b[0]),out=[];
  iv.forEach(([s,e])=>{const l=out[out.length-1];if(l&&s<=l[1])l[1]=Math.max(l[1],e);else out.push([s,e])});return out}
const unionMin=ps=>unionPeriods(ps).reduce((t,[s,e])=>t+e-s,0);
const jrMin=j=>j.v===2?Math.max(0,+j.min||0):(j.start&&j.end?onl(j):0);
const jrKm=j=>j.km==null||j.km===''||!isFinite(+j.km)?null:+j.km;
const jrTrips=j=>j.trips==null||j.trips===''||!isFinite(+j.trips)?null:+j.trips;
const hasAct=j=>jrMin(j)>0||(jrTrips(j)||0)>0||(jrKm(j)||0)>0;
function jrIntervals(j){if(j.v===2)return unionPeriods(j.periods).map(([s,e])=>[s,e,1]);if(j.start&&j.end){const s=hhmm(j.start);let e=hhmm(j.end);if(e<=s)e+=1440;const tot=e-s;return tot?[[s,e,onl(j)/tot]]:[]}return[]}
const jrPeriods=j=>j.v===2?(j.periods||[]):j.start&&j.end?[{s:j.start,e:j.end}]:[];

/* ============ VEÍCULO ============ */
const energyKind=()=>db.vehicle?db.vehicle.energy:'flex'; // sem cadastro: mantém o comportamento antigo (combustão)
const isComb=e=>['flex','gas','hev'].includes(e);
const vehicleIsElectric=()=>energyKind()==='ev';
const fuelTerm=()=>vehicleIsElectric()?'Energia':'Combustível';
const refuelTerm=()=>vehicleIsElectric()?'Recarga':'Abastecimento';
const consumptionUnit=()=>vehicleIsElectric()?'km/kWh':'km/L';
const vehName=v=>v?[v.brand,v.model,v.ver].filter(Boolean).join(' ')+(v.year?' · '+v.year:''):'';
const vehShort=v=>v?[v.brand,v.model].filter(Boolean).join(' ')+(v.year?' '+v.year:''):'';

/* ============ MOTOR DE CÁLCULOS (fonte única de verdade) ============ */
/* custo de energia por km a partir do consumo REAL configurado pelo motorista (sempre uma estimativa) */
function ckm(){const c=cfg(),en=energyKind(),fuel=c.kml>0?c.price/c.kml:0,loss=Math.min(50,Math.max(0,+c.loss||0))/100,el=c.kmkwh>0?c.kwh/(c.kmkwh*(1-loss)):0,share=en==='ev'?1:en==='phev'?Math.min(100,Math.max(0,+c.evShare))/100:0;
  return{fuel:fuel*(1-share),el:el*share,total:fuel*(1-share)+el*share,share,en,loss}}
const fuelCalc={litros:(valor,preco)=>preco>0?valor/preco:0,km:(litros,kml)=>litros*kml,custoKm:(custo,km)=>km>0?custo/km:0};
const isWorkApp=a=>!!APPS[a];
const active=(a,d)=>db.jr.some(j=>j.app===a&&j.d===d&&hasAct(j))||db.tx.some(t=>t.d===d&&t.type==='in'&&appOf(t)===a);
/* Validade inclusiva por data local: a data de início conta como dia 1. */
const passEndDate=p=>addD(p.validFrom||p.d,Math.max(1,Number(p.validDays)||7)-1);
const passIsActive=(p,d)=>!!p&&d>=(p.validFrom||p.d)&&d<=passEndDate(p);
const activePassFor=(a,d)=>db.tx.filter(t=>t.type==='pass'&&appOf(t)===a&&passIsActive(t,d)).sort((x,y)=>String(y.validFrom||y.d).localeCompare(String(x.validFrom||x.d)))[0]||null;
const passOf=(a,wk)=>db.tx.find(t=>t.type==='pass'&&appOf(t)===a&&(t.wk||wkStart(t.d))===wk);
function selectedPass(a){const p=(cfg().pass||{})[a]||{},list=PASS_CATALOG[a]||[];return list.find(x=>x.id===p.packageId)||list[0]}
function ensurePass(a,d){const p=(cfg().pass||{})[a],opt=selectedPass(a);if(!p||!p.on||!APPS[a]||!opt)return;
 if(activePassFor(a,d))return;
 const base='pass-'+a+'-'+d;if(db.tx.some(t=>t.id===base)||(db._del[base]&&db._del[base]!=='auto'))return;
 const price=Number(opt.price)||0,days=Math.max(1,Number(opt.days)||1);
 db.tx.push({id:db._del[base]?base+'-'+uid():base,d,type:'pass',desc:opt.label+' · '+APPS[a].n,v:price,app:a,wk:wkStart(d),validDays:days,validFrom:d,validThrough:addD(d,days-1),packageId:opt.id,at:Date.now()})}
function reconcilePass(a,wk,force){const p=passOf(a,wk);if(!p||!APPS[a])return;if(force||![...Array(7)].some((_,i)=>active(a,addD(wk,i)))){db.tx=db.tx.filter(x=>x!==p);db._del[p.id]='auto';if(!db._del['pass-'+a+'-'+wk])db._del['pass-'+a+'-'+wk]='auto'}}
function passShare(a,f,t){let s=0;db.tx.filter(x=>x.type==='pass'&&appOf(x)===a).forEach(p=>{const n=Math.max(1,Number(p.validDays)||7),start=p.validFrom||p.d,daily=(Number(p.v)||0)/n;for(let i=0;i<n;i++){const d=addD(start,i);if(inR(d,f,t))s+=daily}});return Math.round(s*100)/100}
const ownDaily=()=>{const o=cfg().own||{};return((+o.parcela||0)+(+o.seguro||0)+(+o.deprec||0)+(+o.outros||0))/30+(+o.ipva||0)/365};
/* Custos mensais são rateados pelos dias reais de cada mês; mês completo cobra exatamente o valor mensal. IPVA/licenciamento é anual, rateado por 365 dias. */
function ownBreakdown(f,t){const o=cfg().own||{},monthly=[['Parcela',+o.parcela||0],['Seguro',+o.seguro||0],['Depreciação',+o.deprec||0],['Outros fixos',+o.outros||0]],months=[];let days=0;
 for(let d=f;d<=t;d=addD(d,1)){days++;const md=d.slice(0,7);let m=months.find(x=>x.month===md);if(!m)months.push(m={month:md,days:0,dim:+monthEnd(d).slice(8)});m.days++}
 const parts=monthly.map(([name,v])=>{let amount=0;months.forEach(m=>amount+=v*m.days/m.dim);return{name,value:v,amount}});
 const ipva=(+o.ipva||0)*days/365;return{parts,ipva,total:parts.reduce((a,p)=>a+p.amount,0)+ipva,days,months}}
function passBreakdown(apps,f,t){const rows=[];db.tx.filter(p=>p.type==='pass'&&apps.includes(appOf(p))).forEach(p=>{const n=Math.max(1,Number(p.validDays)||7),start=p.validFrom||p.d,used=[];for(let i=0;i<n;i++){const d=addD(start,i);if(inR(d,f,t))used.push(d)}if(used.length)rows.push({label:p.desc||'Passe',price:+p.v||0,days:n,used:used.length,daily:(+p.v||0)/n,amount:((+p.v||0)/n)*used.length,start,end:addD(start,n-1)})});return rows}
/* parte dos gastos gerais (do veículo) atribuída a cada app: por km quando os dois apps têm km, senão por faturamento */
function shareOf(a,f,t){const st=x=>{const jr=db.jr.filter(j=>j.app===x&&inR(j.d,f,t)),ins=db.tx.filter(z=>z.type==='in'&&appOf(z)===x&&inR(z.d,f,t));return{km:jr.reduce((s,j)=>s+(jrKm(j)||0),0),inc:sum(ins),act:jr.some(hasAct)||ins.length>0}};
  const A=st(a),B=st(a==='uber'?'n99':'uber');if(!A.act)return 0;if(!B.act)return 1;if(A.km>0&&B.km>0)return A.km/(A.km+B.km);const I=A.inc+B.inc;return I>0?A.inc/I:.5}
/* energia, calculada DIA A DIA: no dia com abastecimento/recarga registrado vale o valor real; nos demais dias com km,
   a estimativa por km; sem km nem abastecimento, não é calculada. Nunca soma real + estimativa no mesmo dia, e o total
   de um período é a soma dos seus dias. Combustível é custo do veículo: entre Uber e 99 é dividido pela participação de cada app no dia. */
function energyRange(apps,f,t,perApp){const k=ckm(),c=cfg(),fu={},km={};
  db.tx.forEach(x=>{if(x.type==='fuel'&&inR(x.d,f,t))(fu[x.d]=fu[x.d]||[]).push(x)});
  db.jr.forEach(j=>{if(apps.includes(j.app)&&inR(j.d,f,t)){const v=jrKm(j);if(v!=null)km[j.d]=(km[j.d]||0)+v}});
  let real=0,est=0,estKm=0,lReg=0,kReg=0;
  new Set([...Object.keys(fu),...Object.keys(km)]).forEach(d=>{const fx=fu[d]||[],w=perApp?shareOf(apps[0],d,d):1,r=sum(fx)*w;
    if(r>0){real+=r;fx.forEach(x=>{const q=(+x.qty||0)*w;if((x.unit||'L')==='kWh')kReg+=q;else lReg+=q})}
    else if(km[d]>0){est+=km[d]*k.total;estKm+=km[d]}});
  return{real,est,v:real+est,mode:real>0&&est>0?'mixed':real>0?'real':est>0?'est':'none',estKm,lReg,kReg,litersEst:k.share<1&&c.kml>0?estKm*(1-k.share)/c.kml:0,kwhEst:k.share>0&&c.kmkwh>0?estKm*k.share/c.kmkwh:0}}
function stats(apps,f,t,sh,perApp){const k=ckm(),tx=db.tx.filter(x=>inR(x.d,f,t)),jr=db.jr.filter(j=>apps.includes(j.app)&&inR(j.d,f,t)),w=x=>apps.includes(appOf(x))?1:appOf(x)==='veic'?sh:0;
  const ins=tx.filter(x=>x.type==='in'&&apps.includes(appOf(x))),inc=sum(ins),min=jr.reduce((s,j)=>s+jrMin(j),0);
  const kmL=jr.map(jrKm).filter(x=>x!=null),km=kmL.reduce((s,x)=>s+x,0),kmKnown=kmL.length>0,trL=jr.map(jrTrips).filter(x=>x!=null),n=trL.length?trL.reduce((s,x)=>s+x,0):null;
  const en=energyRange(apps,f,t,perApp),part=ty=>tx.filter(x=>x.type===ty).reduce((s,x)=>s+w(x)*(+x.v||0),0);
  const pass=apps.reduce((s,a)=>s+passShare(a,f,t),0),other=part('other'),maint=part('maint'),days=dDiff(f,t)+1,ownInfo=ownBreakdown(f,t),own=ownInfo.total*sh,passInfo=passBreakdown(apps,f,t);
  const opCost=en.v+pass+other,op=inc-opCost,full=op-maint-own,hr=min/60;
  return{tx,jr,ins,inc,min,hr,km,kmKnown,n,energy:en.v,eReal:en.real,eEst:en.est,emode:en.mode,pass,passInfo,other,maint,own,ownInfo,opCost,op,full,days,sh,lReg:en.lReg,kReg:en.kReg,litersEst:en.litersEst,kwhEst:en.kwhEst,k}}
/* estatísticas de um app (Uber ou 99) no período [f,t] */
function AS(a,f,t){return stats([a],f,t,shareOf(a,f,t),true)}
/* consolidado Uber + 99 + gastos gerais do veículo, sem duplicar lançamentos */
function CS(f,t){const s=stats(['uber','n99'],f,t,1);s.exp=db.tx.filter(x=>x.type!=='in'&&inR(x.d,f,t));s.expTot=sum(s.exp);const wd=workedDays(f,t);s.wd=wd;s.wdInc=sum(s.ins.filter(x=>wd.has(x.d)));return s}
/* dia trabalhado = faturamento ou jornada com atividade (Uber e 99 no mesmo dia contam uma vez; só despesa não conta) */
function workedDays(f,t){const s=new Set();db.tx.forEach(x=>{if(x.type==='in'&&isWorkApp(appOf(x))&&inR(x.d,f,t))s.add(x.d)});db.jr.forEach(j=>{if(isWorkApp(j.app)&&inR(j.d,f,t)&&hasAct(j))s.add(j.d)});return s}
const FPER={d:'Hoje',w:'Últimos 7 dias',m:'Mês atual',c:'Personalizado'};
const PERIODS={d:'Hoje',w:'7 dias',m:'Mês atual'};
function range(p,ref){const t=ref||TODAY();if(p==='w'||p==='7')return[addD(t,-6),t];if(p==='t'||p==='30')return[addD(t,-29),t];if(p==='m')return[t.slice(0,8)+'01',t];return[t,t]}
function frange(){if(fper==='c'){let f=fFrom||TODAY().slice(0,8)+'01',t=fTo||TODAY();if(f>t)[f,t]=[t,f];return[f,t]}return range(fper)}
/* comparação legível com o dia anterior */
function cmpTxt(cur,prev,o){if(!o.has||cur==null||prev==null)return'<span class="cmp">Sem registro para comparar</span>';
  const f=o.fmt||brl,g=o.good||0,cls=x=>g===0?'':(x>0)===(g>0)?'pos':'neg';
  if(Math.abs(cur-prev)<0.005)return`<span class="cmp">Mesmo valor ${o.lb}</span>`;
  if(prev===0)return'<span class="cmp">Sem base de comparação</span>';
  if(prev<0||cur<0){const d=cur-prev;return`<span class="cmp"><span class="${cls(d)}">${f(Math.abs(d))} a ${d>0?'mais':'menos'}</span> que ${o.lb2}</span>`}
  const p=(cur-prev)/prev*100,a=Math.abs(p);return`<span class="cmp"><span class="${cls(p)}">${a<10?num(a,1):num(a,0)}% a ${p>0?'mais':'menos'}</span> que ${o.lb2}</span>`}

/* ============ MANUTENÇÃO ============ */
const COMP={oleo:['Óleo do motor',7000,12,'Intervalo de referência comum: 6.000 a 8.000 km. Siga o manual do fabricante, o tipo de óleo e as condições de uso (aplicativo costuma ser uso severo).'],

  pneus:['Pneus',40000,60,'Verifique calibragem semanalmente e o indicador de desgaste (TWI).'],freios:['Freios',30000,24,'Pastilhas, discos e fluido. Registros antigos de pastilhas/discos aparecem aqui.'],bat12:['Bateria 12 V',0,36],

function interval(k){const d=COMP[k]||['',0,0],o=(cfg().intervals||{})[k]||{},evb=energyKind()==='ev'&&k==='freios';return{km:o.km!=null?+o.km:(evb?60000:d[1]),m:o.m!=null?+o.m:d[2]}}
/* quilometragem: o valor informado é real; a soma dos km de jornadas posteriores é exibida como estimativa */
function odoNow(){const v=db.vehicle;if(!v||v.odo==null||v.odo===''||!isFinite(+v.odo))return{km:null};const base=+v.odo,bd=v.odoD||TODAY(),add=db.jr.filter(j=>j.d>bd).reduce((s,j)=>s+(jrKm(j)||0),0);return{km:base+add,est:add>0,base,bd,add}}
function bumpOdo(km,d){const v=db.vehicle;if(!v||!(km>0))return;if(v.odo==null||km>v.odo){v.odo=km;v.odoD=d}}
const doneRecs=k=>db.maint.filter(m=>aliasOf(k).includes(m.comp)&&!m.planned).sort((a,b)=>(a.d+String(a.odo||0).padStart(8,'0')).localeCompare(b.d+String(b.odo||0).padStart(8,'0')));
/* próximo km/data: se foram calculados automaticamente, acompanham o intervalo configurado hoje; se digitados, são mantidos */
function nextOf(m,k){const iv=interval(k),d0=COMP[m.comp]||['',0,0],aK=m.nkAuto!=null?m.nkAuto:!!(m.odo&&m.nextKm===m.odo+d0[1]),aD=m.ndAuto!=null?m.ndAuto:m.nextD===addM(m.d,d0[2]);
  return{nk:aK?(m.odo&&iv.km?m.odo+iv.km:null):(m.nextKm||null),nd:aD?(iv.m?addM(m.d,iv.m):null):(m.nextD||null)}}
function compState(k){const r=doneRecs(k),iv=interval(k),o=odoNow().km,sn=db.snooze[k]||{},plan=db.maint.filter(m=>aliasOf(k).includes(m.comp)&&m.planned).sort((a,b)=>a.d.localeCompare(b.d))[0];
  if(!r.length)return{st:'none',iv,plan,n:0};
  // para itens agrupados (ex.: Freios = pastilhas, discos, fluido), avalia o último registro de cada subcomponente
  // que não foi superado por um registro posterior do próprio item, e mostra o pior estado
  const lastMain=r.filter(m=>m.comp===k).pop(),cands=[...new Set(r.map(m=>m.comp))].map(c=>r.filter(m=>m.comp===c).pop()).filter(m=>m.comp===k||!lastMain||m.d>lastMain.d);
  const rank={vencido:0,proximo:1,ok:2};let best=null;
  cands.forEach(last=>{const nx=nextOf(last,k),nk=nx.nk!=null?nx.nk+(+sn.km||0):null,nd=nx.nd?addD(nx.nd,+sn.days||0):null,rk=nk!=null&&o!=null?nk-o:null,rd=nd?dDiff(TODAY(),nd):null;
    const st=(rk!=null&&rk<=0)||(rd!=null&&rd<0)?'vencido':(rk!=null&&rk<=Math.max(500,iv.km*.1))||(rd!=null&&rd<=30)?'proximo':'ok',c={st,last,nk,nd,rk,rd};
    if(!best||rank[st]<rank[best.st]||(rank[st]===rank[best.st]&&(rk??1e12)<(best.rk??1e12)))best=c});
  return Object.assign(best,{iv,plan,n:r.length,sn})}
/* componentes fora da lista essencial que já têm histórico continuam visíveis */
function otherHist(){const cov=new Set(comps().flatMap(aliasOf));return[...new Set(db.maint.map(m=>m.comp))].filter(k=>!cov.has(k)&&COMP[k])}
const ST={none:['sem registro',''],ok:['em dia','ok'],proximo:['próximo','warn'],vencido:['vencido','bad'],planejado:['planejado','est'],concluido:['concluído','ok']};
function measured(unit){const f=db.tx.filter(t=>t.type==='fuel'&&(t.unit||'L')===unit&&t.odo>0&&t.qty>0).sort((a,b)=>a.odo-b.odo);let km=0,q=0,n=0,p=-1,acc=0;
  f.forEach((t,i)=>{if(p>=0)acc+=t.qty;if(t.full){if(p>=0&&t.odo>f[p].odo){km+=t.odo-f[p].odo;q+=acc;n++}p=i;acc=0}});return n?{v:km/q,n,km,q}:null}
const mcost=m=>(+m.part||0)+(+m.labor||0);
const addM=(s,m)=>{const d=pd(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+m);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return iso(d)};

/* ============ CONTAS, RESERVAS E PREVISÃO ============ */
function occ(b,f,t){const out=[];if(!b.due)return out;const end=b.n>0?(b.rec==='mensal'?addM(b.due,b.n-1):addD(b.due,7*(b.n-1))):null;
  const ok=d=>d>=b.due&&inR(d,f,t)&&(!end||d<=end);
  if(b.rec==='mensal'){const day=+b.due.slice(8);let y=+f.slice(0,4),m=+f.slice(5,7)-1;for(let i=0;i<240;i++){const last=new Date(y,m+1,0).getDate(),d=iso(new Date(y,m,Math.min(day,last)));if(d>t)break;if(ok(d))out.push(d);m++;if(m>11){m=0;y++}}}
  else if(b.rec==='semanal'){let k=Math.max(0,Math.ceil(dDiff(b.due,f)/7)),d=addD(b.due,7*k);while(d<=t){if(ok(d))out.push(d);d=addD(d,7)}}
  else if(ok(b.due))out.push(b.due);return out}
const paidOf=(b,o)=>(b.pays||[]).filter(p=>p.occ===o).reduce((s,p)=>s+p.v,0);
const resBal=r=>(r.moves||[]).reduce((s,m)=>s+m.v,0);
function billOccs(f,t){const r=[];db.bills.forEach(b=>occ(b,f,t).forEach(o=>{const pd_=paidOf(b,o),rem=Math.max(0,Math.round((b.v-pd_)*100)/100);r.push({b,o,paid:pd_,rem,st:rem<=.004?'pago':o<TODAY()?'vencida':pd_>0?'parcial':'pendente'})}));return r.sort((a,b)=>a.o.localeCompare(b.o))}
function cashNow(){const c=cfg().cash;if(!c)return null;const after=x=>x.at?x.at>c.at:x.d>c.d;let v=+c.v;
  db.tx.filter(after).forEach(x=>v+=x.type==='in'?x.v:-x.v);db.bills.forEach(b=>(b.pays||[]).filter(after).forEach(p=>v-=p.v));return v}
function forecast(){const t=TODAY(),me=monthEnd(t),rem=dDiff(t,me),cash=cashNow(),reserved=db.reserves.reduce((s,r)=>s+resBal(r),0);
  const first=db.tx.map(x=>x.d).sort()[0],ws=first?(addD(t,-28)>first?addD(t,-28):first):null,days=ws?dDiff(ws,t):0,nets=[];
  for(let i=0;i<days;i++){const d=addD(ws,i);nets.push(db.tx.filter(x=>x.d===d&&x.type!=='pass').reduce((s,x)=>s+(x.type==='in'?x.v:-x.v),0))}
  const N=nets.length,mean=N?nets.reduce((a,b)=>a+b,0)/N:0,sd=N>1?Math.sqrt(nets.reduce((s,x)=>s+(x-mean)**2,0)/(N-1)):0;
  const occs=billOccs(addD(t,-90),me).filter(x=>x.rem>0);let bills=0,covered=0;
  const cov={};occs.forEach(x=>{const r=db.reserves.find(r=>r.bill===x.b.id);let rm=x.rem;if(r){const left=resBal(r)-(cov[r.id]||0),u=Math.max(0,Math.min(left,rm));cov[r.id]=(cov[r.id]||0)+u;covered+=u;rm-=u}bills+=rm});
  let passes=0;const mondays=[];for(let d=addD(t,1);d<=me;d=addD(d,1))if(pd(d).getDay()===1)mondays.push(d);
  Object.keys(APPS).forEach(a=>{const p=(cfg().pass||{})[a];if(p&&p.on&&[...Array(14)].some((_,i)=>active(a,addD(t,-i))))passes+=mondays.length*(+p.v||0)});
  const conf=N<7?'insuficiente':N<14?'baixa':N<28?'média':'boa',est=N>=7?mean*rem:0,free=cash==null?null:cash-reserved;
  const base=free==null?null:free-bills-passes,z=1.28*sd*Math.sqrt(rem);
  return{t,me,rem,cash,reserved,free,N,mean,sd,conf,est,bills,covered,passes,occs,prob:base==null?null:base+est,cons:N>=14&&base!=null?base+est-z:null,opt:N>=14&&base!=null?base+est+z:null,ws}}

/* ============ PRODUTIVIDADE POR HORÁRIO ============
   Horas e km vêm dos períodos informados. Ganhos antigos com horário entram na hora registrada;
   ganhos diários sem horário são distribuídos pelos períodos do mesmo dia (estimativa) ou ficam "sem horário". */
const BANDS=[['Madrugada',0,5],['Manhã',6,11],['Tarde',12,17],['Noite',18,23]],DOW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function jrSplit(j){const out=[],km=jrKm(j),iv=jrIntervals(j),tot=iv.reduce((s,[a,b])=>s+b-a,0);
  iv.forEach(([s,e,fac])=>{let x=s;while(x<e){const nx=Math.min(e,(Math.floor(x/60)+1)*60),mins=nx-x;out.push({d:addD(j.d,Math.floor(x/1440)),h:Math.floor(x/60)%24,min:mins*fac,km:km!=null&&tot?km*mins/tot:0});x=nx}});return out}
function prod(apps,f,t){const k=ckm().total,mk=()=>({inc:0,min:0,km:0,days:new Set()}),H=[...Array(24)].map(mk),D=[...Array(7)].map(mk),U=mk();let incEst=0;
  const jrs=db.jr.filter(j=>apps.includes(j.app)&&inR(j.d,f,t));
  jrs.forEach(j=>{const w=pd(j.d).getDay(),m=jrMin(j),km=jrKm(j)||0;if(hasAct(j)){D[w].min+=m;D[w].km+=km;D[w].days.add(j.d)}
    const sp=jrSplit(j);if(sp.length)sp.forEach(p=>{H[p.h].min+=p.min;H[p.h].km+=p.km;H[p.h].days.add(p.d)});else if(m>0){U.min+=m;U.km+=km;U.days.add(j.d)}});
  db.tx.filter(x=>x.type==='in'&&apps.includes(appOf(x))&&inR(x.d,f,t)).forEach(x=>{const w=pd(x.d).getDay();D[w].inc+=x.v;D[w].days.add(x.d);
    if(x.h!=null){H[(x.h||0)%24].inc+=x.v;H[(x.h||0)%24].days.add(x.d);return}
    const sp=jrs.filter(j=>j.app===appOf(x)&&j.d===x.d).flatMap(jrSplit),tm=sp.reduce((s,p)=>s+p.min,0);
    if(tm>0){sp.forEach(p=>{H[p.h].inc+=x.v*p.min/tm});incEst+=x.v}else{U.inc+=x.v;U.days.add(x.d)}});
  const fin=o=>{o.cost=o.km*k;o.net=o.inc-o.cost;o.hr=o.min/60;o.nph=o.hr>0?o.net/o.hr:null;o.obs=o.days.size;return o};
  H.forEach(fin);D.forEach(fin);fin(U);const B=BANDS.map(([n,a,b])=>{const o={n,...mk()};for(let h=a;h<=b;h++){o.inc+=H[h].inc;o.min+=H[h].min;o.km+=H[h].km;H[h].days.forEach(d=>o.days.add(d))}return fin(o)});
  return{H,D,B,U,k,incEst}}
</script>
<script>
/* ============ COMPONENTES COMPARTILHADOS ============ */
function toast(m,undo){const t=$('#toast');t.innerHTML=esc(m)+(undo?' <button>Desfazer</button>':'');t.classList.add('on');if(undo)t.querySelector('button').onclick=()=>{undo();t.classList.remove('on')};clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),6000)}
const mark=()=>{db.days[TODAY()]=true}; // mantém o histórico de dias ativos (dados do antigo módulo Progresso)
const dateLabel=()=>new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const net=d=>sum(db.tx.filter(t=>t.d===d&&t.type==='in'))-sum(db.tx.filter(t=>t.d===d&&t.type!=='in'));
const dailyGoals=()=>db.goals.filter(g=>g.kind==='dia');
const goalsDone=()=>dailyGoals().filter(g=>g.last===TODAY()).length;
const hm=m=>Math.floor(m/60)+'h '+String(Math.round(m%60)).padStart(2,'0')+'min';
const empt=t=>`<p class="empty">${t}</p>`;
const del=(col,id)=>`<button type="button" class="x" data-del="${col}:${id}" aria-label="Remover">✕</button>`;
const edt=id=>`<button type="button" class="x" data-edit="${id}" aria-label="Editar">✎</button>`;
const seg=(attr,cur,opts)=>`<div class="seg" role="group">${Object.entries(opts).map(([k,n])=>`<button type="button" class="${k===cur?'on':''}" data-${attr}="${k}" aria-pressed="${k===cur}">${n}</button>`).join('')}</div>`;
const rseg=(name,cur,opts)=>`<div class="seg" role="radiogroup">${Object.entries(opts).map(([k,n])=>`<label><input type="radio" name="${name}" value="${k}" ${k===cur?'checked':''}>${n}</label>`).join('')}</div>`;
const kpi=(h,v,sub,cls)=>`<div class="kpi ${cls||''}"><h5>${h}</h5><div class="v">${v}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
const EST='<span class="tag est">estimado</span>',REG='<span class="tag ok">registrado</span>';
const emTag=m=>m==='real'?REG:m==='est'?EST:m==='mixed'?REG+' '+EST:'<span class="tag">sem dados</span>';
/* linha de composição: rótulo | barra proporcional | valor (grid; o valor desce de linha em telas estreitas) */
const crow=(label,v,total,cls)=>{const p=total>0?clamp(v/total*100,0,100):0;return`<div class="crow ${cls||''}"><span class="cl">${label}</span><span class="cbar" aria-hidden="true"><i style="width:${p.toFixed(1)}%"></i></span><span class="cv">${brl(v)}</span></div>`};
const CAR_ICON='<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l2-5.5A2 2 0 0 1 6.9 6h10.2a2 2 0 0 1 1.9 1.5L21 13v4a1 1 0 0 1-1 1h-1.5M3 13v4a1 1 0 0 0 1 1h1.5M3 13h18M8.5 18h7"/><circle cx="7" cy="17.5" r="1.6"/><circle cx="17" cy="17.5" r="1.6"/></svg>';

function attention(){const t=TODAY(),it=[],row=(tg,cl,tx,b)=>it.push('<div class="alert"><span class="tag '+cl+'">'+tg+'</span><div class="g">'+esc(tx)+'</div>'+(b||'')+'</div>');
if(!db.vehicle)row('Veículo','Média','Cadastre seu veículo para calcular consumo, custo por km e lembretes de manutenção.','<button class="btn" data-onboard>Cadastrar</button>');
billOccs(addD(t,-90),addD(t,14)).filter(o=>o.rem>0&&(o.o<t||dDiff(t,o.o)<=(o.b.remind??3))).slice(0,4).forEach(o=>row(o.o<t?'Conta vencida':'Conta','Alta',o.b.name+' · '+brl(o.rem)+' · vence '+fmtD(o.o),'<button class="btn" data-paybtn="'+o.b.id+'|'+o.o+'">Pagar</button>'));
if(db.vehicle)comps().map(k=>[k,compState(k)]).filter(x=>x[1].st==='vencido'||x[1].st==='proximo').slice(0,3).forEach(([k,s])=>row(s.st==='vencido'?'Manutenção vencida':'Manutenção',s.st==='vencido'?'Alta':'Média',COMP[k][0]+(s.rk!=null?' · '+(s.rk>0?'faltam '+num(s.rk,0)+' km':num(-s.rk,0)+' km além do previsto'):'')+(s.nd?' · data '+fmtD(s.nd):''),'<button class="btn" data-gomanut>Ver</button>'));
dailyGoals().filter(g=>g.last!==t).slice(0,3).forEach(g=>row('Meta','',g.text,'<button class="btn" data-goal="'+g.id+'">Concluir</button>'));
if(net(t)<0)row('Financeiro','Alta','Gastos de hoje superam as entradas em '+brl(-net(t))+'.');
return it.length?it.join(''):empt('Nada pendente por enquanto.')}
const gColor=p=>{const c=cfg(),lo=clamp(+c.gLo,0,100),hi=Math.max(lo,clamp(+c.gHi,0,100));p=Math.floor(clamp(p*100,0,1e6))/100;return p*100<lo?'var(--bad)':p*100<hi?'var(--warn)':'var(--ok)'};

/* ============ RESUMO DO VEÍCULO (sem 3D) ============ */
function vehCard(){const v=db.vehicle;
  if(!v)return`<div class="c s12 vsum"><span class="vico">${CAR_ICON}</span><div class="vname"><b>Nenhum veículo cadastrado</b><small>Cadastre para calcular consumo, custo por km e lembretes de manutenção.</small></div><button class="btn sm" data-onboard>Cadastrar veículo</button></div>`;
  const c=cfg(),en=energyKind(),k=ckm(),od=odoNow(),ch=[];
  ch.push(['Quilometragem',od.km==null?'<span class="mutd">não informada</span>':num(od.km,0)+' km'+(od.est?' '+EST:'')]);
  if(en!=='ev')ch.push(['Consumo real',c.kml>0?num(c.kml,1)+' km/L':'—'],['Combustível',c.price>0?brl(c.price)+'/L':'—']);
  if(en==='ev'||en==='phev')ch.push(['Eficiência real',c.kmkwh>0?num(c.kmkwh,1)+' km/kWh':'—'],['Energia',c.kwh>0?brl(c.kwh)+'/kWh':'—']);
  ch.push(['Custo por km',k.total>0?brl(k.total)+' '+EST:'<span class="mutd">sem dados</span>']);
  return`<div class="c s12 vsum"><span class="vico">${CAR_ICON}</span><div class="vname"><b>${esc(vehName(v))}</b><small>${ENERGY[en]||''}${isComb(en)?' · '+esc(c.fuel):''}</small></div><div class="vchips">${ch.map(x=>`<span><small>${x[0]}</small>${x[1]}</span>`).join('')}</div><button class="btn ghost sm" data-onboard>Editar veículo</button></div>`}

/* ============ MANUTENÇÃO ESSENCIAL (compacta) ============ */
function maintRow(k){const s=compState(k),[sl,scl]=ST[s.st],iv=s.iv,recs=db.maint.filter(m=>aliasOf(k).includes(m.comp)).sort((a,b)=>b.d.localeCompare(a.d));
  const nx=s.nk!=null?'Próximo: '+num(s.nk,0)+' km':s.nd?'Próximo: '+fmtD(s.nd):'Próximo: —';
  const rem=s.rk!=null?(s.rk>0?' · faltam '+num(s.rk,0)+' km':' · '+num(-s.rk,0)+' km além'):s.rd!=null?(s.rd>=0?' · em '+s.rd+' dia(s)':' · '+(-s.rd)+' dia(s) de atraso'):'';
  return`<details class="mrow" data-comp="${k}"><summary><span class="mn">${COMP[k][0]}</span><span class="tag ${scl}">${sl}</span>${s.plan?'<span class="tag est">planejado '+fmtD(s.plan.d)+'</span>':''}
   <span class="mi">${s.last?'Último: '+fmtD(s.last.d)+(s.last.odo?' · '+num(s.last.odo,0)+' km':' · km não informado'):'Sem registro'}</span><span class="mi">${s.last?nx+rem:''}</span>
   <button type="button" class="btn ghost sm" data-maint="${k}">Registrar manutenção</button></summary>
   <div class="mdet">${COMP[k][3]?`<p class="note" style="margin-top:0">${COMP[k][3]}</p>`:''}
    <div class="ivrow">Intervalo: <input type="text" inputmode="numeric" data-iv="${k}:km" value="${iv.km||''}" placeholder="km" aria-label="Intervalo em km"> km ou <input type="text" inputmode="numeric" data-iv="${k}:m" value="${iv.m||''}" placeholder="meses" aria-label="Intervalo em meses"> meses <small>(0 = não usar; ajuste conforme o manual)</small></div>
    ${s.last?`<div class="row wrap" style="gap:6px;margin:10px 0"><button type="button" class="btn ghost sm" data-snz="${k}:km">Adiar 500 km</button><button type="button" class="btn ghost sm" data-snz="${k}:days">Adiar 30 dias</button>${s.sn&&(s.sn.km||s.sn.days)?'<span class="sub">adiado (histórico preservado)</span>':''}</div>`:''}
    <div class="list">${recs.length?recs.map(m=>`<div class="it"><div class="g">${fmtD(m.d)}${m.odo?' · '+num(m.odo,0)+' km':''} ${m.planned?'<span class="tag est">planejado</span>':''}${m.comp!==k?' <span class="tag">'+COMP[m.comp][0]+'</span>':''}<small>${mcost(m)?'peça '+brl(+m.part||0)+' + mão de obra '+brl(+m.labor||0)+' = '+brl(mcost(m)):'sem custo informado'}${m.brand?' · '+esc(m.brand):''}${m.ref?' '+esc(m.ref):''}${m.shop?' · '+esc(m.shop):''}${(()=>{const x=nextOf(m,k);return(x.nk?' · próximo '+num(x.nk,0)+' km':'')+(x.nd?' · '+fmtD(x.nd):'')})()}${m.txId?' · no financeiro':''}${m.notes?' · '+esc(m.notes):''}</small></div>${m.planned?`<button type="button" class="btn ghost sm" data-mdone="${m.id}">Concluir</button>`:''}${del('maint',m.id)}</div>`).join(''):empt('Nenhum registro para este item.')}</div></div></details>`}
function maintSection(){const v=db.vehicle;if(!v)return'';const od=odoNow(),st=comps().map(k=>compState(k).st),n1=st.filter(x=>x==='vencido').length,n2=st.filter(x=>x==='proximo').length,oth=otherHist(),en=energyKind();
  const bt=db.batt.slice().sort((a,b)=>b.d.localeCompare(a.d))[0];
  return`<div class="c s12" id="manut"><div class="mhead"><h3 style="margin:0">Manutenção do veículo</h3>${n1?`<span class="tag bad">${n1} vencido(s)</span>`:''}${n2?`<span class="tag warn">${n2} próximo(s)</span>`:''}${!n1&&!n2?'<span class="tag ok">sem alertas</span>':''}</div>
   <form data-form="odo" class="odoform" novalidate><label for="odo-in">Quilometragem atual do veículo</label><div class="row"><input id="odo-in" name="km" inputmode="numeric" autocomplete="off" placeholder="Quilometragem não informada" value="${v.odo!=null&&v.odo!==''?Math.round(v.odo):''}"><button class="btn sm" style="flex:0 0 auto">Salvar km</button></div>
   <small>${od.km==null?'Quilometragem não informada.':'Informada: '+num(od.base,0)+' km em '+fmtD(od.bd)+(od.est?' · estimativa atual '+num(od.km,0)+' km (+'+num(od.add,0)+' km registrados em jornadas)':'')}</small><div class="err" data-err></div></form>
   <div class="mlist">${comps().map(maintRow).join('')}${oth.length?`<div class="sub" style="margin:12px 0 2px">Outros itens com histórico</div>${oth.map(maintRow).join('')}`:''}</div>

 }catch(e){console.warn('Ranking global indisponível',e)}finally{globalRankLoading='';if(tab==='ranking')render()}

 const rows=globalRankCache.filter(r=>r.period_start===f&&r.period_end===t).map(r=>({name:r.display_name,veh:r.vehicle||'Veículo não cadastrado',op:Number(r.operating_profit)||0,revenue:Number(r.revenue)||0,best:r.highlighted_app||'—',act:true,me:r.user_id===user.id}));
 if(!rows.some(r=>r.me)){const mine=rankOf(db,user.name,f,t,true);if(mine.act)rows.push(mine)}

  const A=(id,i,n,crit,f)=>L_.push({id,i,n,crit,f});
  A('reg1','📝','Primeiro dia completo','Um dia com jornada (horas, viagens ou km) e faturamento lançados no mesmo aplicativo.',()=>ds.length?{ok:1,ev:'Dia '+fmtD(ds[0])+' com jornada e faturamento registrados.'}:{prog:'nenhum dia completo ainda'});

  A('nph','📈','Lucro por hora em evolução','Lucro operacional por hora dos últimos 14 dias pelo menos 10% maior que o dos 14 dias anteriores, com 5+ dias de jornada em cada período.',()=>{const g=(f,to)=>{let op=0,min=0,dd=new Set();['uber','n99'].forEach(a=>{const s=AS(a,f,to);op+=s.op;min+=s.min;s.jr.filter(hasAct).forEach(j=>dd.add(j.d))});return{v:min?op/(min/60):0,n:dd.size}};const a=g(addD(t,-13),t),b=g(addD(t,-27),addD(t,-14));return a.n>=5&&b.n>=5&&b.v>0&&a.v>=b.v*1.1?{ok:1,ev:brl(a.v)+'/h contra '+brl(b.v)+'/h nos 14 dias anteriores.'}:{prog:'atual '+(a.n?brl(a.v)+'/h ('+a.n+' dias)':'—')+' · anterior '+(b.n?brl(b.v)+'/h ('+b.n+' dias)':'—')}});
  A('mnt','🔧','Manutenção no prazo','Um serviço registrado antes de atingir o km ou a data previstos pelo registro anterior do mesmo componente.',()=>{for(const k of Object.keys(COMP)){const r=db.maint.filter(m=>m.comp===k&&!m.planned).sort((a,b)=>a.d.localeCompare(b.d));for(let i=1;i<r.length;i++){const p=r[i-1],c=r[i];if((p.nextKm&&c.odo&&c.odo<=p.nextKm)||(p.nextD&&c.d<=p.nextD))return{ok:1,ev:COMP[k][0]+' em '+fmtD(c.d)+(c.odo?' com '+num(c.odo,0)+' km':'')+' (previsto: '+(p.nextKm?num(p.nextKm,0)+' km':'')+(p.nextD?' '+fmtD(p.nextD):'')+').'}}}return{prog:'precisa de dois registros do mesmo componente'}});
  A('res','🏦','Reserva concluída','Uma reserva ou meta de economia atingiu 100% do valor alvo.',()=>{const r=db.reserves.find(r=>r.target>0&&resBal(r)>=r.target);return r?{ok:1,ev:r.name+': '+brl(resBal(r))+' de '+brl(r.target)+'.'}:{prog:db.reserves.length?Math.max(...db.reserves.map(r=>r.target?resBal(r)/r.target*100:0)).toFixed(0)+'% na reserva mais adiantada':'nenhuma reserva'}});
  A('bill','✅','Contas do mês em dia','Todas as contas com vencimento no mês anterior pagas integralmente até o vencimento.',()=>{const pm=addD(t.slice(0,8)+'01',-1),f=pm.slice(0,8)+'01',os=billOccs(f,pm);if(!os.length)return{prog:'nenhuma conta no mês anterior'};const ok=os.every(o=>o.rem<=.004&&(o.b.pays||[]).filter(p=>p.occ===o.o).every(p=>p.d<=o.o));return ok?{ok:1,ev:os.length+' conta(s) de '+pm.slice(5,7)+'/'+pm.slice(0,4)+' pagas no prazo.'}:{prog:'alguma conta do mês anterior foi paga com atraso ou está em aberto'}});
  A('fin','📒','Registro financeiro completo','Veículo cadastrado, saldo em conta informado e ao menos uma conta a pagar cadastrada.',()=>db.vehicle&&cfg().cash&&db.bills.length?{ok:1,ev:'Veículo, saldo e '+db.bills.length+' conta(s) cadastrados.'}:{prog:[db.vehicle?'':'veículo',cfg().cash?'':'saldo',db.bills.length?'':'conta'].filter(Boolean).join(', ')+' pendente(s)'});
  let ch=false;L_.forEach(a=>{a.r=a.f()||{};if(a.r.ok&&!db.ach[a.id]){db.ach[a.id]={d:t,ev:a.r.ev};ch=true}});if(ch)Store.save();return L_}

/* ============ ASSISTENTE (local, com base no motor de cálculos) ============ */
function askLocal(q){const s=fold(q),t=TODAY();let f,to=t,pl;
  const m=s.match(/(\d+)\s*dias?/);if(m){f=addD(t,-(+m[1]-1));pl='últimos '+m[1]+' dias'}else if(/ontem/.test(s)){f=to=addD(t,-1);pl='ontem'}else if(/hoje/.test(s)){f=t;pl='hoje'}else if(/mes passado|mes anterior/.test(s)){to=addD(t.slice(0,8)+'01',-1);f=to.slice(0,8)+'01';pl='mês anterior'}else if(/\bmes\b/.test(s)){f=t.slice(0,8)+'01';pl='mês atual'}else if(/semana/.test(s)){f=addD(t,-6);pl='últimos 7 dias'}
  const def=(d,l)=>{if(!f){f=d;pl=l}};const per=()=>`<small>Período: ${pl} (${fmtD(f)}${f!==to?' a '+fmtD(to):''}).</small>`;const perT=()=>per().replace(/<\/?small>/g,'');

  if(/previs|final do mes|fim do mes|saldo/.test(s)){const fc=forecast();if(fc.cash==null)return'Ainda não sei seu saldo atual. Informe-o em Finanças → "Informar saldo" e eu calculo a previsão.';
    return`Previsão para ${fmtD(fc.me)}: <b>${brl(fc.prob)}</b> ${fc.N>=7?'(provável)':'(só compromissos confirmados: histórico insuficiente)'}${fc.cons!=null?`, entre ${brl(fc.cons)} e ${brl(fc.opt)}`:''}.<br>Cálculo: saldo livre ${brl(fc.free)} (saldo ${brl(fc.cash)} − reservas ${brl(fc.reserved)}) − contas ${brl(fc.bills)} − passes ${brl(fc.passes)} ${fc.N>=7?'+ média diária '+brl(fc.mean)+' × '+fc.rem+' dias':''}.<small>Base: ${fc.N} dia(s) de histórico, confiança ${fc.conf}. Previsão não é garantia; a média diária é estimativa.</small>`}
  if(/parcela|guardar|prestac/.test(s)){const r=db.reserves.find(r=>r.kind==='parcela'),b=db.bills.find(b=>b.cat==='parcela');if(!r&&!b)return'Não encontrei uma reserva do tipo "Prestação do veículo" nem uma conta do tipo "Parcela do veículo". Cadastre em Finanças para eu calcular.';
    let tgt=r?r.target:b.v,due=r&&r.due;if(!due&&b){const o=billOccs(t,addD(t,62)).find(o=>o.b.id===b.id&&o.rem>0);due=o&&o.o;if(o)tgt=o.rem}const have=r?resBal(r):0,left=Math.max(0,tgt-have),dd=due?Math.max(1,dDiff(t,due)):null;
    return`Para a parcela${due?' com vencimento em '+fmtD(due):''} faltam <b>${brl(left)}</b> (alvo ${brl(tgt)}, reservado ${brl(have)}).${dd&&left>0?' Isso dá cerca de <b>'+brl(left/dd)+' por dia</b> até lá ('+dd+' dias).':''}<small>Fonte: ${r?'reserva "'+esc(r.name)+'"':''}${r&&b?' e ':''}${b?'conta "'+esc(b.name)+'"':''}. Valores registrados por você.</small>`}
  if(/manutenc/.test(s)){def(t.slice(0,8)+'01','mês atual');const tx=db.tx.filter(x=>x.type==='maint'&&inR(x.d,f,to)),gr=db.maint.filter(m=>!m.planned&&inR(m.d,f,to)),go=gr.filter(m=>!m.txId);
    return`Manutenção no financeiro: <b>${brl(sum(tx))}</b> em ${tx.length} lançamento(s).${go.length?' Há ainda '+brl(go.reduce((a,m)=>a+mcost(m),0))+' em '+go.length+' serviço(s) registrados na manutenção sem despesa no financeiro.':''}${gr.length?' Serviços: '+[...new Set(gr.map(m=>COMP[m.comp]?COMP[m.comp][0]:m.comp))].join(', ')+'.':''}${per()}`}
  if(/combust|gasolin|etanol|energia|recarga|gastando demais/.test(s)){def(addD(t,-29),'últimos 30 dias');const x=both(),n=dDiff(f,to)+1,pc=CS(addD(f,-n),addD(to,-n)),v=db.vehicle,c=cfg(),ml=measured('L');
    if(!x.energy)return'Não há abastecimentos registrados nem km informados nesse período, então não consigo avaliar o gasto com energia.'+per();
    const sh=x.inc?x.energy/x.inc*100:null,psh=pc.inc?pc.energy/pc.inc*100:null;
    return`Energia (${emT(x.emode)}): <b>${brl(x.energy)}</b>${x.km>0?' para '+num(x.km,0)+' km ('+brl(x.energy/x.km)+'/km)':''}${sh!=null?', <b>'+num(sh,0)+'% do faturamento</b>':''}${psh!=null?' (período anterior: '+num(psh,0)+'%)':''}.${v&&v.refCons&&v.refUnit==='km/L'?' Seu consumo configurado é '+num(c.kml,1)+' km/L; a referência aproximada do modelo é '+num(v.refCons,1)+' km/L'+(c.kml<v.refCons*.85?', ou seja, abaixo da referência: vale checar pneus, filtro de ar e estilo de condução.':'.'):''}${ml?' Consumo medido entre tanques cheios: '+num(ml.v,2)+' km/L.':''}<small>Dias com abastecimento registrado usam o valor real (${brl(x.c.eReal)}); os demais dias com km usam estimativa (${brl(x.c.eEst)}). ${perT()}</small>`}
  if(/custo.*(km|quilom)|por (km|quilom)/.test(s)){def(addD(t,-29),'últimos 30 dias');const x=both();if(!(x.km>0))return'Sem km informados nesse período. Informe a quilometragem na jornada para calcular o custo por km.'+per();
    return`Custo operacional médio: <b>${brl(x.cost/x.km)}/km</b> (energia ${emT(x.emode)} + passe + outros: ${brl(x.cost)} ÷ ${num(x.km,0)} km). Incluindo manutenção e custos fixos: <b>${brl((x.inc-x.full)/x.km)}/km</b>.<small>${pl}: ${x.jr} jornada(s).</small>`}
  if(/horari|melhor hora|que horas/.test(s)){def(addD(t,-89),'últimos 90 dias');const P=prod(['uber','n99'],f,to),b=P.B.filter(o=>o.obs>=3&&o.nph!=null&&o.hr>0).sort((a,c)=>c.nph-a.nph);
    return b.length?'Faixas do dia por lucro operacional/hora: '+b.map(o=>`<b>${o.n}</b> (${brl(o.nph)}/h, ${o.obs} dias)`).join(', ')+'.'+per():'Ainda não há faixas com 3+ dias de observação. Informe os períodos de trabalho na jornada.'+per()}
  if(/(qual|que) (app|aplicativo)|uber.*99|99.*uber|por hora/.test(s)){def(addD(t,-29),'últimos 30 dias');const u=AS('uber',f,to),n=AS('n99',f,to),uh=u.hr?u.op/u.hr:null,nh=n.hr?n.op/n.hr:null;
    if(uh==null&&nh==null)return'Não há horas trabalhadas registradas para comparar.'+per();
    return`Lucro operacional por hora: Uber <b>${uh!=null?brl(uh):'—'}</b> (${hm(u.min)}), 99 <b>${nh!=null?brl(nh):'—'}</b> (${hm(n.min)}). ${uh!=null&&nh!=null?'Maior: <b>'+(uh>=nh?'Uber':'99')+'</b>.':''}${Math.min(u.jr.length,n.jr.length)<5?' Atenção: poucas jornadas em pelo menos um dos apps.':''}<small>Cálculo: (faturamento − energia − passe − outros) ÷ horas trabalhadas. ${perT()}</small>`}
  if(/conta|vencim|pagar/.test(s)){const o=billOccs(addD(t,-90),addD(t,30)).filter(o=>o.rem>0);return o.length?'Contas em aberto: '+o.slice(0,6).map(x=>`${esc(x.b.name)} ${brl(x.rem)} (${x.o<t?'vencida em ':'vence '}${fmtD(x.o)})`).join('; ')+'.':'Nenhuma conta em aberto nos próximos 30 dias.'}
  if(/lucr|ganh|fatur|rendeu/.test(s)){def(addD(t,-6),'últimos 7 dias');const x=both();if(!x.tx&&!x.jr)return'Não encontrei lançamentos nesse período.'+per();
    return`Faturamento <b>${brl(x.inc)}</b>, custos operacionais ${brl(x.cost)} (energia ${emT(x.emode)}), lucro operacional <b>${brl(x.op)}</b> (Uber ${brl(x.u.op)}, 99 ${brl(x.n.op)}). Resultado completo, com manutenção e custos fixos: ${brl(x.full)}.<small>Base: ${x.c.ins.length} lançamento(s) de faturamento e ${x.jr} jornada(s). ${perT()}</small>`}
  return null}
async function ask(q){chat.push({me:1,h:esc(q)});let a=askLocal(q);
  if(a==null){if(C.aiEndpoint){chat.push({h:'Consultando a IA externa configurada…'});render();

<script>
/* ============ INTEGRAÇÃO OFICIAL UBER (Driver API) ============
   O navegador nunca recebe client_secret, code trocado nem tokens: só conversa com as Edge Functions do Supabase,
   autenticado pelo JWT do usuário NESC. Funciona apenas no modo nuvem (Supabase), porque a conexão precisa ser
   vinculada a um usuário verificável no servidor. Nada é buscado automaticamente: a importação só ocorre ao clicar. */
const UBER_RET=(()=>{try{const q=new URLSearchParams(location.search),r=q.get('uber');if(!r)return null;const o={r,reason:(q.get('uber_reason')||'').replace(/[^a-z0-9_]/gi,'')};
  q.delete('uber');q.delete('uber_reason');q.delete('tab');const s=q.toString();history.replaceState(null,'',location.pathname+(s?'?'+s:'')+location.hash);return o}catch(e){return null}})();
const UBER_MSG={access_denied:'Você recusou a autorização na Uber. Nada foi conectado.',invalid_state:'A solicitação de conexão expirou ou não é válida. Tente conectar novamente.',token_exchange_failed:'A Uber não confirmou a autorização. Tente conectar novamente.',
  authorization_error:'A Uber retornou um erro na autorização.',invalid_code:'Retorno inválido da Uber. Tente novamente.',not_configured:'A integração ainda está em configuração no servidor.',scope_not_approved:'A Uber ainda não liberou os dados (escopos) para este aplicativo.',
  no_scopes_granted:'Nenhuma permissão foi concedida pela Uber.',token_revoked:'A autorização foi revogada ou expirou. Conecte novamente.',refresh_unavailable:'A autorização expirou. Conecte novamente.',profile_unavailable:'Conectado, mas o perfil não pôde ser lido agora.',
  rate_limited:'A Uber limitou as consultas por agora. Tente mais tarde.',uber_unavailable:'A Uber não respondeu. Tente mais tarde.'};
const UBER_ST={config:['Integração em configuração',''],not_configured:['Integração em configuração',''],awaiting_approval:['Aguardando aprovação','warn'],disconnected:['Não conectado',''],authorizing:['Aguardando autorização','est'],
  connected:['Conectado','ok'],access_pending:['Acesso pendente','warn'],error:['Erro','bad'],revoked:['Reconexão necessária','bad'],unavailable:['Serviço indisponível','bad']};
const SCOPE_N={'partner.accounts':'perfil','partner.trips':'viagens','partner.payments':'pagamentos'};
const UberLink={st:null,loading:false,busy:'',
  fnBase(){return String(C.functionsUrl||(C.supabaseUrl?C.supabaseUrl.replace(/\/+$/,'')+'/functions/v1':'')).replace(/\/+$/,'')},
  available(){return!!(Cloud.on&&C.uberEnabled&&user&&user.id&&this.fnBase())},
  async call(name,method,body){await Cloud.init();const{data}=await Cloud.sb.auth.getSession(),tk=data&&data.session&&data.session.access_token;if(!tk)throw new Error('session');
    const r=await fetch(this.fnBase()+'/'+name,{method:method||'GET',headers:{Authorization:'Bearer '+tk,apikey:C.supabaseAnonKey,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
    let j={};try{j=await r.json()}catch(e){}return{ok:r.ok,status:r.status,j}},
  async refresh(){if(!this.available()||this.loading)return;this.loading=true;try{const r=await this.call('uber-connection');this.st=r.ok?r.j:{status:'unavailable'}}catch(e){this.st={status:'unavailable'}}this.loading=false;if(tab==='uber')render()},
  async connect(){if(this.busy)return;this.busy='connect';render();
    try{const r=await this.call('uber-oauth-start','POST',{return_to:location.origin+location.pathname+'?tab=uber'});
      let u=null;try{u=r.j.authorize_url?new URL(r.j.authorize_url):null}catch(e){}
      if(r.ok&&u&&(u.protocol==='https:'||(u.protocol==='http:'&&['localhost','127.0.0.1'].includes(u.hostname)))){location.assign(u.toString());return} // só https (ou localhost no desenvolvimento)
      this.st=Object.assign({},this.st,{status:r.j.status==='awaiting_approval'?'awaiting_approval':r.j.status==='not_configured'?'not_configured':'error',last_error_code:r.j.error||r.j.status||'authorization_error'});
      toast(r.j.status==='awaiting_approval'?'O app ainda aguarda aprovação da Uber para a sua conta.':r.j.status==='not_configured'?'A integração ainda está em configuração.':'Não foi possível iniciar a conexão com a Uber.')}
    catch(e){toast('Sem conexão com o servidor da integração.')}this.busy='';render()},
  async disconnect(purgeServer,removeLocal){if(this.busy)return;this.busy='disconnect';render();
    try{const r=await this.call('uber-connection','DELETE',{purge:!!purgeServer});if(!r.ok)throw 0;
      if(removeLocal){const ids=new Set(db.tx.filter(t=>t.src==='uber_api').map(t=>t.id).concat(db.jr.filter(j=>j.src==='uber_api').map(j=>j.id)));ids.forEach(id=>db._del[id]=1);db.tx=db.tx.filter(t=>!ids.has(t.id));db.jr=db.jr.filter(j=>!ids.has(j.id));db.jr.forEach(j=>{if(j.tripsSrc==='uber_api'){delete j.tripsSrc}});Store.save()}
      toast(r.j.revoked_at_uber?'Uber desconectada e autorização revogada.':'Uber desconectada neste app. Se quiser, remova o acesso também nas configurações da sua conta Uber.');await this.refresh()}
    catch(e){toast('Não foi possível desconectar agora. Tente novamente.')}this.busy='';render()},
  async sync(days){if(this.busy)return;this.busy='sync';render();
    try{const r=await this.call('uber-sync','POST',{days:days||30});
      if(r.status===401){this.st=Object.assign({},this.st,{status:'revoked',last_error_code:'token_revoked'});toast(UBER_MSG.token_revoked)}
      else if(!r.ok){toast(UBER_MSG[r.j.error]||'A sincronização falhou.');await this.refresh()}
      else{const s=uberImport(r.j);this.st=Object.assign({},this.st,{status:r.j.status,profile:r.j.profile,last_sync_at:new Date().toISOString(),last_error_code:r.j.scopes_pending&&r.j.scopes_pending.length?'scope_not_approved':null});
        toast(`Uber: ${s.inDays} dia(s) de faturamento e ${s.tripDays} dia(s) de viagens atualizados${s.conflicts?' · '+s.conflicts+' para revisar':''}.`);if(s.conflicts)openUberReview()}}
    catch(e){toast('Sem conexão com o servidor da integração.')}this.busy='';render()}
};
/* concilia os registros oficiais com os dados do app: não duplica, não substitui registro manual sem consentimento */
const uDay=s=>{const d=new Date(s);return isNaN(d)?null:iso(d)};
function uberDaily(res){const days={};const g=d=>days[d]=days[d]||{inc:0,fee:0,trips:0,km:0,hasPay:false,hasTrip:false,cur:new Set()};
  (res.payments||[]).forEach(p=>{const d=p.event_time&&uDay(p.event_time),a=+p.amount;if(!d||!isFinite(a))return;const o=g(d);o.hasPay=true;if(p.currency_code)o.cur.add(p.currency_code);if(a>=0)o.inc+=a;else o.fee+=-a});
  (res.trips||[]).forEach(t=>{const d=(t.end_time||t.start_time)&&uDay(t.end_time||t.start_time);if(!d||(t.status&&t.status!=='completed'))return;const o=g(d);o.hasTrip=true;o.trips++;const km=+t.distance;if(isFinite(km)&&km>0)o.km+=t.distance_unit==='km'?km:km*1.609344});
  return days}
function uberImport(res){const dec=(db.cfg.uberImport=db.cfg.uberImport||{decisions:{},pending:[]}),days=uberDaily(res),pend=[];let inDays=0,tripDays=0;
  Object.entries(days).forEach(([d,o])=>{if(d>TODAY())return;const D=dec.decisions[d]||{};
    if(o.hasPay){if([...o.cur].some(c=>c!=='BRL'))return;const id='uber-api-in-'+d,fid='uber-api-fee-'+d,cur=db.tx.find(t=>t.id===id),man=db.tx.filter(t=>t.type==='in'&&appOf(t)==='uber'&&t.d===d&&t.src!=='uber_api');
      const v=Math.round(o.inc*100)/100;
      if(db._del[id]||D.inc==='manual'){}else if(man.length){pend.push({d,k:'inc',manual:sum(man),official:v})}
      else{if(cur){if(cur.v!==v){cur.v=v;cur.at=Date.now()}}else if(v>0)db.tx.push({id,d,type:'in',desc:'Faturamento Uber (oficial)',v,app:'uber',src:'uber_api',at:Date.now()});if(v>0){ensurePass('uber',d);inDays++}
        const fv=Math.round(o.fee*100)/100,fc=db.tx.find(t=>t.id===fid);if(fc){fc.v=fv}else if(fv>0&&!db._del[fid])db.tx.push({id:fid,d,type:'other',desc:'Débitos Uber (oficial)',v:fv,app:'uber',src:'uber_api',at:Date.now()});db.tx=db.tx.filter(t=>!(t.id===fid&&!(t.v>0)))}}
    if(o.hasTrip){const id='uber-api-jr-'+d,cur=db.jr.find(j=>j.id===id),man=db.jr.filter(j=>j.app==='uber'&&j.d===d&&j.src!=='uber_api');
      if(db._del[id]||D.trips==='manual'){}
      else if(man.length){const m=man[0];if(m.tripsSrc==='uber_api'&&man.length===1){{m.trips=o.trips;m.tripsSrc='uber_api';m.kmTrips=Math.round(o.km*10)/10;tripDays++}}else pend.push({d,k:'trips',manual:man.reduce((s,j)=>s+(jrTrips(j)||0),0),official:o.trips,km:o.km})}
      else{const rec={d,app:'uber',v:2,min:0,periods:[],trips:o.trips,km:null,kmSrc:null,kmTrips:Math.round(o.km*10)/10,notes:'Viagens importadas da Uber',src:'uber_api',at:Date.now()};if(cur)Object.assign(cur,rec);else db.jr.push(Object.assign({id},rec));ensurePass('uber',d);tripDays++}}});
  dec.pending=pend;dec.lastImport=new Date().toISOString();Store.save();return{inDays,tripDays,conflicts:pend.length}}
function openUberReview(){const p=(db.cfg.uberImport||{}).pending||[];if(!p.length){toast('Nada para revisar.');return}
  modal(`<h2>Revisar importação da Uber</h2><p class="sub" style="margin-bottom:14px">Nestes dias você já tinha registros manuais. Nada foi alterado. Escolha o que vale em cada dia; registros manuais substituídos ficam guardados e podem ser restaurados.</p>

      if(x.official>0)db.tx.push({id:'uber-api-in-'+x.d,d:x.d,type:'in',desc:'Faturamento Uber (oficial)',v:x.official,app:'uber',src:'uber_api',at:Date.now()})}

function restoreUberManual(){const arch=db.cfg.uberArchive||[];if(!arch.length)return;let n=0;
  arch.forEach(a=>{const r=a.rec;if(r.type==='in'){db.tx=db.tx.filter(t=>t.id!=='uber-api-in-'+r.d);db._del['uber-api-in-'+r.d]=1;if(!db.tx.some(t=>t.d===r.d&&t.type==='in'&&appOf(t)==='uber'&&t.desc===r.desc&&t.v===r.v))db.tx.push(Object.assign({},r,{id:uid(),at:Date.now()}));n++;

  db.cfg.uberArchive=[];Store.save();render();toast(n+' registro(s) manual(is) restaurado(s).')}
function uberCard(){const avail=UberLink.available(),st=UberLink.st,s=!avail?'config':st?st.status:'loading';

  if(k==='odo'){if(!db.vehicle)return;if(!f.km){db.vehicle.odo=null;db.vehicle.odoD=null;return ok('Quilometragem removida: aparece como não informada.')}const v=parseOdo(f.km);if(!(v>=0))return ferr(fm,'Quilometragem inválida.');db.vehicle.odo=Math.round(v);db.vehicle.odoD=d;return ok('Quilometragem atualizada.')}
  if(k==='cash'){const v=parseMoney(String(f.v||'').replace(/^-/,''));if(!isFinite(v))return ferr(fm,'Valor inválido.');db.cfg.cash={v:String(f.v).trim().startsWith('-')?-v:v,at:Date.now(),d};return ok('Saldo atualizado.')}
  if(k==='bill'){const v=parseMoney(f.v);if(!(f.name||'').trim())return ferr(fm,'Informe a descrição.');if(!(v>0))return ferr(fm,'Informe um valor válido.');if(!f.due)return ferr(fm,'Informe o vencimento.');const n=f.n?parseInt(f.n,10):0;if(f.n&&!(n>0))return ferr(fm,'Número de parcelas inválido.');
    db.bills.push({id,name:f.name.trim(),v,due:f.due,rec:REC[f.rec]?f.rec:'unica',n:n||0,cat:f.cat||'outros',remind:3,pays:[]});return ok('Conta cadastrada.')}
  if(k==='res'){const v=parseMoney(f.target);if(!(f.name||'').trim())return ferr(fm,'Informe o nome.');if(!(v>0))return ferr(fm,'Informe o valor alvo.');db.reserves.push({id,name:f.name.trim(),kind:f.kind,target:v,due:f.due||'',bill:f.bill||'',moves:[]});return ok('Reserva criada.')}
  if(k==='pay'){const b=db.bills.find(x=>x.id===f.bid);if(!b)return closeModal();const rem=Math.max(0,b.v-paidOf(b,f.occ)),v=parseMoney(f.v);if(!(v>0)||v>rem+.004)return ferr(fm,'Valor entre R$ 0,01 e '+brl(rem)+'.');
    (b.pays=b.pays||[]).push({id:uid(),occ:f.occ,v,d:f.d||d,at:Date.now()});return ok((v<rem-.004?'Pagamento parcial de ':'Pagamento de ')+brl(v)+' registrado.')}
  if(k==='resmv'){const r=db.reserves.find(x=>x.id===f.id),v=parseMoney(f.v),sg=+f.sg;if(!r)return closeModal();if(!(v>0))return ferr(fm,'Informe o valor.');if(sg<0&&v>resBal(r)+.004)return ferr(fm,'A reserva tem só '+brl(resBal(r))+'.');
    if(sg>0){const fc=forecast();if(fc.free!=null&&v>fc.free+.004)return ferr(fm,'Saldo livre insuficiente ('+brl(fc.free)+'). O mesmo dinheiro não pode ficar livre e reservado ao mesmo tempo.')}
    (r.moves=r.moves||[]).push({id:uid(),v:sg>0?v:-v,d,at:Date.now()});return ok(sg>0?brl(v)+' reservado.':brl(v)+' devolvido ao saldo livre.')}
  if(k==='own'){const o={};for(const q of['parcela','seguro','ipva','deprec','outros']){const v=f[q]?parseMoney(f[q]):0;if(!(v>=0))return ferr(fm,'Valor inválido.');o[q]=v}db.cfg.own=o;return ok('Custos fixos atualizados.')}
  if(k==='batt'){const v=parseDec(f.soh);if(!(v>0&&v<=100))return ferr(fm,'Informe a saúde entre 0 e 100%.');db.batt.push({id,d:f.d||d,soh:v,src:f.src,note:''});return ok('Leitura registrada.')}
});

/* ============ ENTRADA NO APP ============ */
function enter(u,anim){
  user=u;Store.load();
  const done=()=>{stopLogin();$('#auth').style.display='none';container.style.display='none';const a=$('#app');a.classList.add('on');if(anim&&!RM.matches)a.classList.add('reveal');render();if(anim)requestAnimationFrame(()=>requestAnimationFrame(()=>a.classList.remove('reveal')));
    Store.pull();
    if(UBER_RET){tab='uber';render();const m={connected:'Conta Uber conectada. Use "Sincronizar" para importar os dados oficiais.',access_pending:'Conta Uber conectada, mas a Uber ainda não liberou o acesso aos dados.',denied:UBER_MSG.access_denied,error:UBER_MSG[UBER_RET.reason]||'Não foi possível conectar a Uber.'}[UBER_RET.r];if(m)toast(m);UBER_RET.r='';}
    /* O cadastro do veículo é opcional e fica disponível nas abas Uber e 99. */};
  if(!anim||RM.matches){done();return}
  loginZoom();$('#auth').classList.add('leaving');container.classList.add('leaving');setTimeout(done,950);
}
(async()=>{const s=await Auth.session();if(s&&s.email)enter(s)})();
