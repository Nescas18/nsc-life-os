<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NSC Life OS - Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050505;
      color: #ffffff;
    }

    /* Canvas 3D em Segundo Plano */
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Container Principal Dividido (Estilo Drael) */
    .layout-container {
      position: relative;
      z-index: 2;
      display: flex;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    /* Lado Esquerdo - Painel de Autenticação */
    .left-panel {
      pointer-events: auto;
      width: 45%;
      min-width: 380px;
      max-width: 520px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 60px;
      background: linear-gradient(90deg, rgba(5,5,5,0.95) 0%, rgba(5,5,5,0.7) 70%, rgba(5,5,5,0) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* Lado Direito - Espaço Livre para o Planeta 3D */
    .right-panel {
      flex: 1;
      height: 100%;
    }

    .brand-title {
      font-size: 2.8rem;
      font-weight: 600;
      letter-spacing: -1.2px;
      line-height: 1.1;
      margin-bottom: 12px;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.95rem;
      color: #71717a;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    /* Abas para Alternar entre Login e Cadastro */
    .auth-tabs {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: #71717a;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      padding-bottom: 4px;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      color: #ffffff;
      border-bottom: 2px solid #ffffff;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #a1a1aa;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-group input:focus {
      border-color: rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.07);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn-submit:hover {
      background: #e4e4e7;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .form-footer {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .forgot-link {
      font-size: 0.85rem;
      color: #71717a;
      text-decoration: none;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: #ffffff;
    }

    /* Ajuste para Telas Menores / Celulares */
    @media (max-width: 768px) {
      .left-panel {
        width: 100%;
        min-width: 100%;
        padding: 0 24px;
        background: rgba(5, 5, 5, 0.85);
      }
      .right-panel {
        display: none;
      }
      .brand-title {
        font-size: 2.2rem;
      }
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="layout-container">
    <!-- LADO ESQUERDO: LOGIN E CRIAÇÃO DE CONTA -->
    <div class="left-panel">
      <h1 class="brand-title">NSC Life OS</h1>
      <p class="brand-subtitle">Acesse seu ecossistema ou crie uma nova conta para começar.</p>

      <div class="auth-tabs">
        <button class="tab-btn active" id="btn-tab-login" onclick="switchTab('login')">Entrar</button>
        <button class="tab-btn" id="btn-tab-register" onclick="switchTab('register')">Criar Conta</button>
      </div>

      <!-- Formulário de Login -->
      <form id="form-login" onsubmit="handleAuth(event, 'login')">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" placeholder="seu@email.com" required />
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-submit">Acessar Sistema</button>
        <div class="form-footer">
          <a href="#" class="forgot-link">Esqueceu a senha?</a>
        </div>
      </form>

      <!-- Formulário de Cadastro (Oculto por padrão) -->
      <form id="form-register" style="display: none;" onsubmit="handleAuth(event, 'register')">
        <div class="form-group">
          <label>Nome Completo</label>
          <input type="text" placeholder="Seu nome" required />
        </div>
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" placeholder="seu@email.com" required />
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" placeholder="Mínimo 6 caracteres" required />
        </div>
        <button type="submit" class="btn-submit">Criar Minha Conta</button>
      </form>
    </div>

    <!-- LADO DIREITO: RESERVADO PARA EXIBIR O PLANETA EM DESTAQUE -->
    <div class="right-panel"></div>
  </div>

  <script>
    // --- LÓGICA DE ALTERNÂNCIA DAS ABAS (LOGIN / CADASTRO) ---
    function switchTab(mode) {
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');
      const tabLogin = document.getElementById('btn-tab-login');
      const tabRegister = document.getElementById('btn-tab-register');

      if (mode === 'login') {
        formLogin.style.display = 'block';
        formRegister.style.display = 'none';
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
      } else {
        formLogin.style.display = 'none';
        formRegister.style.display = 'block';
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
      }
    }

    function handleAuth(event, mode) {
      event.preventDefault();
      alert(mode === 'login' ? 'Processando login com Supabase...' : 'Criando conta no Supabase...');
      // Aqui conectamos as chamadas oficiais do supabase.auth.signInWithPassword() ou signUp()
    }

    // --- CONFIGURAÇÃO DA CENA 3D (DESLOCADA PARA O LADO DIREITO) ---
    const container = document.getElementById('canvas-container');

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.0012);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    // Posicionamento da Câmera: ligeiramente deslocada para dar foco ao lado direito
    function updateCameraPosition() {
      if (window.innerWidth > 768) {
        camera.position.set(-6, 18, 38); // Offset para empurrar o centro do planeta para a direita
        camera.lookAt(2, 0, 0);
      } else {
        camera.position.set(0, 18, 42);
        camera.lookAt(0, 0, 0);
      }
    }
    updateCameraPosition();

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x050505, 1);
    container.appendChild(renderer.domElement);

    // Textura Suave Radial para as Partículas
    function createParticleTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');

      const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
      gradient.addColorStop(0.2, 'rgba(220, 225, 235, 0.8)');
      gradient.addColorStop(0.5, 'rgba(120, 130, 150, 0.3)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 64, 64);

      const texture = new THREE.Texture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    // Esfera Central (Buraco Negro / Planeta Sombrio)
    const sphereGeometry = new THREE.SphereGeometry(3.2, 64, 64);
    const sphereMaterial = new THREE.MeshStandardMaterial({
      color: 0x08080a,
      roughness: 0.8,
      metalness: 0.2
    });
    const planet = new THREE.Mesh(sphereGeometry, sphereMaterial);
    
    // Desloca levemente o centro do planeta para alinhar no painel direito
    planet.position.set(3, 0, 0);
    scene.add(planet);

    // Luzes
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(10, 20, 15);
    scene.add(dirLight);

    // Disco de Partículas Densas
    const particleCount = 38000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const orbitAngles = new Float32Array(particleCount);
    const orbitSpeed = new Float32Array(particleCount);
    const orbitRadius = new Float32Array(particleCount);

    const innerRadius = 5.5;
    const outerRadius = 23.0;

    for (let i = 0; i < particleCount; i++) {
      const r = innerRadius + Math.pow(Math.random(), 1.8) * (outerRadius - innerRadius);
      const angle = Math.random() * Math.PI * 2;
      const y = (Math.random() - 0.5) * (0.8 * (r / outerRadius));

      positions[i * 3] = planet.position.x + Math.cos(angle) * r;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = planet.position.z + Math.sin(angle) * r;

      orbitRadius[i] = r;
      orbitAngles[i] = angle;
      orbitSpeed[i] = (0.005 + (1 / r) * 0.04) * (0.8 + Math.random() * 0.4);
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const particleMaterial = new THREE.PointsMaterial({
      size: 0.45,
      map: createParticleTexture(),
      transparent: true,
      opacity: 0.85,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const particleSystem = new THREE.Points(geometry, particleMaterial);
    particleSystem.rotation.z = THREE.MathUtils.degToRad(8);
    particleSystem.rotation.x = THREE.MathUtils.degToRad(12);
    scene.add(particleSystem);

    // Loop de Animação
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const posArray = particleSystem.geometry.attributes.position.array;

      for (let i = 0; i < particleCount; i++) {
        orbitAngles[i] += orbitSpeed[i] * 0.6;

        const r = orbitRadius[i];
        posArray[i * 3] = planet.position.x + Math.cos(orbitAngles[i]) * r;
        posArray[i * 3 + 2] = planet.position.z + Math.sin(orbitAngles[i]) * r;
      }

      particleSystem.geometry.attributes.position.needsUpdate = true;
      planet.rotation.y += 0.002;

      renderer.render(scene, camera);
    }

    animate();

    // Responsividade
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      updateCameraPosition();
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
