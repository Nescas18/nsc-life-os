<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NSC Life OS</title>
<style>
:root{--bg:#030305;--panel:rgba(255,255,255,.035);--panel2:rgba(255,255,255,.06);--line:rgba(255,255,255,.09);--tx:#f4f4f5;--mut:#8a8a94;--ac:#e4e4e7;--ok:#5ad19a;--bad:#f0716b;--warn:#e9b95b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body,html{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--tx)}
#canvas-container{position:absolute;inset:0;z-index:1}
.layout-container{position:relative;z-index:2;display:flex;width:100vw;height:100%;pointer-events:none}
.left-panel{pointer-events:auto;width:45%;min-width:380px;max-width:520px;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 60px;background:linear-gradient(90deg,rgba(5,5,5,.95) 0%,rgba(5,5,5,.7) 70%,rgba(5,5,5,0) 100%);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.right-panel{flex:1;height:100%}
.brand-title{font-size:2.8rem;font-weight:600;letter-spacing:-1.2px;line-height:1.1;margin-bottom:12px;background:linear-gradient(180deg,#fff 0%,#a1a1aa 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand-subtitle{font-size:.95rem;color:#71717a;margin-bottom:32px;line-height:1.5}
.auth-tabs{display:flex;gap:16px;margin-bottom:24px;border-bottom:1px solid var(--line);padding-bottom:8px}
.tab-btn{background:none;border:none;color:#71717a;font-size:.9rem;font-weight:500;cursor:pointer;padding-bottom:4px;transition:all .2s}
.tab-btn.active{color:#fff;border-bottom:2px solid #fff}
.form-group{margin-bottom:18px}
.form-group label,.f label{display:block;font-size:.75rem;letter-spacing:.3px;color:#a1a1aa;margin-bottom:8px}
input,select{width:100%;padding:13px 15px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:10px;color:#fff;font-size:.95rem;outline:none;transition:all .2s}
input:focus,select:focus{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.07)}
select option{background:#0c0c10}
.btn-submit,.btn{padding:13px 20px;background:#fff;color:#000;border:none;border-radius:10px;font-weight:600;font-size:.92rem;cursor:pointer;transition:background .2s,transform .1s}
.btn-submit{width:100%;margin-top:10px}
.btn-submit:hover,.btn:hover{background:#e4e4e7}.btn-submit:active,.btn:active{transform:scale(.98)}
.form-footer{margin-top:20px}.forgot-link{font-size:.85rem;color:#71717a;text-decoration:none}.forgot-link:hover{color:#fff}
.err{color:var(--bad);font-size:.85rem;min-height:20px;margin-top:10px}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* APP */
#app{display:none;position:absolute;inset:0;z-index:3;background:var(--bg)}
#app.on{display:flex}
aside{width:236px;flex-shrink:0;border-right:1px solid var(--line);padding:26px 14px;display:flex;flex-direction:column;gap:4px;background:rgba(255,255,255,.015)}
.logo{font-size:1.1rem;font-weight:650;letter-spacing:-.4px;padding:0 12px 22px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;background:none;border:none;color:var(--mut);font-size:.92rem;cursor:pointer;text-align:left;width:100%}
.nav:hover{color:var(--tx);background:var(--panel)}
.nav.on{color:var(--tx);background:var(--panel2);box-shadow:inset 2px 0 0 #fff}
.spacer{flex:1}
.user{padding:12px;font-size:.82rem;color:var(--mut);border-top:1px solid var(--line)}
.user b{display:block;color:var(--tx);font-weight:550;margin-bottom:6px}
.user button{background:none;border:none;color:var(--mut);cursor:pointer;font-size:.82rem;text-decoration:underline}
main{flex:1;overflow-y:auto;padding:30px 36px 60px}
.head h1{font-size:1.7rem;font-weight:620;letter-spacing:-.6px}
.head p{color:var(--mut);margin:4px 0 24px;font-size:.92rem;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.c{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}.s3{grid-column:span 3}
.c h3{font-size:.88rem;font-weight:560;color:var(--mut);margin-bottom:14px}
.big{font-size:2rem;font-weight:640;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.sub{color:var(--mut);font-size:.85rem;margin-top:4px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.bar{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:#fff;border-radius:6px;transition:width .4s}
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:230px;overflow:hidden;position:relative}
.hero h2{font-family:Georgia,"Iowan Old Style",serif;font-weight:400;font-size:2.6rem;letter-spacing:-1px;line-height:1.05;margin-bottom:12px}
.hero p{color:var(--mut);max-width:380px;line-height:1.55;font-size:.92rem}
#globe{width:260px;height:230px;cursor:grab;flex-shrink:0}
.f{margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.list{display:flex;flex-direction:column}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.it:last-child{border:none}.it .g{flex:1;min-width:0}.it small{display:block;color:var(--mut);font-size:.78rem;margin-top:2px}
.x{background:none;border:none;color:var(--mut);cursor:pointer;font-size:1rem;padding:4px 8px;border-radius:6px;flex:0 0 auto;width:auto}
.x:hover{color:var(--bad);background:var(--panel)}
.chk{width:22px;height:22px;border-radius:7px;border:1.5px solid #52525b;background:none;cursor:pointer;flex:0 0 22px;padding:0;color:#000;font-size:.8rem;font-weight:700}
.chk.on{background:#fff;border-color:#fff}
.done{text-decoration:line-through;color:var(--mut)}
.tag{font-size:.72rem;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--mut)}
.tag.Alta{color:var(--bad);border-color:rgba(240,113,107,.4)}.tag.Média{color:var(--warn);border-color:rgba(233,185,91,.4)}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:.72rem;color:var(--mut)}
.chart i{width:100%;max-width:38px;background:#fff;border-radius:5px 5px 2px 2px;min-height:3px;opacity:.88}
.hb{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:.85rem}.hb span:first-child{width:96px;color:var(--mut)}.hb .bar{flex:1;margin:0}.hb span:last-child{width:84px;text-align:right}
.cells{display:grid;grid-template-columns:repeat(consistent,1fr)}
.cells{display:flex;flex-wrap:wrap;gap:4px}.cells i{width:11px;height:11px;border-radius:3px;background:var(--panel2)}.cells i.on{background:#fff}.cells i.cur{outline:1px solid #fff}
.empty{color:var(--mut);font-size:.9rem;padding:6px 0}
input[type=range]{padding:0;height:6px;accent-color:#fff}
@media(max-width:900px){
.left-panel{width:100%;min-width:100%;max-width:none;padding:0 24px;background:rgba(5,5,5,.85)}.right-panel{display:none}.brand-title{font-size:2.2rem}
#app.on{flex-direction:column}
aside{width:100%;flex-direction:row;order:2;border-right:0;border-top:1px solid var(--line);padding:6px;overflow-x:auto;gap:2px}
.logo,.user,.spacer{display:none}
.nav{flex-direction:column;gap:3px;padding:8px 12px;font-size:.68rem;white-space:nowrap;width:auto}.nav.on{box-shadow:none}
main{padding:20px 16px 30px}.s8,.s6,.s4,.s3{grid-column:span 12}
.hero h2{font-size:2rem}#globe{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="canvas-container"></div>

<div class="layout-container" id="auth">
  <div class="left-panel">
    <h1 class="brand-title">NSC Life OS</h1>
    <p class="brand-subtitle">Acesse seu ecossistema ou crie uma nova conta para começar.</p>
    <div class="auth-tabs">
      <button class="tab-btn active" id="btn-tab-login" onclick="switchTab('login')">Entrar</button>
      <button class="tab-btn" id="btn-tab-register" onclick="switchTab('register')">Criar Conta</button>
    </div>
    <form id="form-login" onsubmit="handleAuth(event,'login')">
      <div class="form-group"><label>E-mail</label><input name="email" type="email" placeholder="seu@email.com" required /></div>
      <div class="form-group"><label>Senha</label><input name="pass" type="password" placeholder="••••••••" required /></div>
      <button type="submit" class="btn-submit">Acessar Sistema</button>
      <div class="form-footer"><a href="#" class="forgot-link">Esqueceu a senha?</a></div>
    </form>
    <form id="form-register" style="display:none" onsubmit="handleAuth(event,'register')">
      <div class="form-group"><label>Nome Completo</label><input name="name" type="text" placeholder="Seu nome" required /></div>
      <div class="form-group"><label>E-mail</label><input name="email" type="email" placeholder="seu@email.com" required /></div>
      <div class="form-group"><label>Senha</label><input name="pass" type="password" placeholder="Mínimo 6 caracteres" minlength="6" required /></div>
      <button type="submit" class="btn-submit">Criar Minha Conta</button>
    </form>
    <div class="err" id="auth-err" role="alert"></div>
  </div>
  <div class="right-panel"></div>
</div>

<div id="app">
  <aside id="nav"></aside>
  <main><div id="view"></div></main>
</div>

<script>
/* ============ CAMADA DE DADOS (trocar por Supabase aqui) ============ */
const mem={};
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
const SUPABASE_URL="https://pmjmmfmggjqtamoybobq.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBtam1tZm1nZ2pxdGFtb3lib2JxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQwOTE5MjAsImV4cCI6MjA3OTY2NzkyMH0.m8p0MzlR_1_EZ5V1ALTG-w15ZW6vBzbig9rTXGyEBCk";
const cloud=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const Auth={
 async signUp(name,email,pass){
   const {data,error}=await cloud.auth.signUp({email,password:pass,options:{data:{name}}});
   if(error)throw error;
   if(!data.session)throw new Error("Conta criada. Confirme o e-mail e depois entre.");
   return {email:data.user.email,name:name||data.user.user_metadata?.name||email.split("@")[0],id:data.user.id};
 },
 async signIn(email,pass){
   const {data,error}=await cloud.auth.signInWithPassword({email,password:pass});
   if(error)throw new Error(error.message==="Invalid login credentials"?"E-mail ou senha incorretos. Verifique se essa conta já existe no Supabase.":error.message);
   return {email:data.user.email,name:data.user.user_metadata?.name||data.user.email.split("@")[0],id:data.user.id};
 },
 async session(){
   const {data}=await cloud.auth.getSession();
   const s=data.session;
   return s?.user?{email:s.user.email,name:s.user.user_metadata?.name||s.user.email.split("@")[0],id:s.user.id}:null;
 },
 async end(){await cloud.auth.signOut()}
};
let user=null,db=null;
const empty=()=>({tx:[],goals:[],workouts:[],tasks:[],sleep:[],days:{}});
const Store={load(){try{db=Object.assign(empty(),JSON.parse(LS.get('nsc_db_'+user.email)||'{}'))}catch(e){db=empty()}},save(){LS.set('nsc_db_'+user.email,JSON.stringify(db))}};

/* ============ AUTH UI ============ */
function switchTab(mode){
  const l=mode==='login';
  document.getElementById('form-login').style.display=l?'block':'none';
  document.getElementById('form-register').style.display=l?'none':'block';
  document.getElementById('btn-tab-login').classList.toggle('active',l);
  document.getElementById('btn-tab-register').classList.toggle('active',!l);
  document.getElementById('auth-err').textContent='';
}
async function handleAuth(e,mode){
  e.preventDefault();
  const f=new FormData(e.target),err=document.getElementById('auth-err');
  const submit=e.target.querySelector('button[type="submit"]');
  const email=f.get('email').trim().toLowerCase();
  err.textContent='';submit.disabled=true;submit.textContent='Aguarde...';
  try{
    const u=mode==='login'?await Auth.signIn(email,f.get('pass')):await Auth.signUp(f.get('name').trim(),email,f.get('pass'));
    enter(u);
  }catch(x){err.textContent=x.message||'Não foi possível autenticar.'}
  finally{submit.disabled=false;submit.textContent=mode==='login'?'Acessar Sistema':'Criar Minha Conta'}
}

/* ============ CENA 3D DO LOGIN (base preservada) ============ */
const container=document.getElementById('canvas-container');
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x050505,0.0012);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,1000);
function updateCameraPosition(){
  if(innerWidth>768){camera.position.set(-6,18,38);camera.lookAt(2,0,0)}
  else{camera.position.set(0,18,42);camera.lookAt(0,0,0)}
}
updateCameraPosition();
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x050505,1);
container.appendChild(renderer.domElement);
function createParticleTexture(){
  const c=document.createElement('canvas');c.width=c.height=64;
  const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.2,'rgba(220,225,235,.8)');g.addColorStop(.5,'rgba(120,130,150,.3)');g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,64,64);
  const t=new THREE.Texture(c);t.needsUpdate=true;return t;
}
const planet=new THREE.Mesh(new THREE.SphereGeometry(3.2,64,64),new THREE.MeshStandardMaterial({color:0x08080a,roughness:.8,metalness:.2}));
planet.position.set(3,0,0);scene.add(planet);
scene.add(new THREE.AmbientLight(0xffffff,.2));
const dirLight=new THREE.DirectionalLight(0xffffff,1.2);dirLight.position.set(10,20,15);scene.add(dirLight);
const particleCount=38000,geometry=new THREE.BufferGeometry();
const positions=new Float32Array(particleCount*3),orbitAngles=new Float32Array(particleCount),orbitSpeed=new Float32Array(particleCount),orbitRadius=new Float32Array(particleCount);
const innerRadius=5.5,outerRadius=23;
for(let i=0;i<particleCount;i++){
  const r=innerRadius+Math.pow(Math.random(),1.8)*(outerRadius-innerRadius),a=Math.random()*Math.PI*2,y=(Math.random()-.5)*(.8*(r/outerRadius));
  positions[i*3]=planet.position.x+Math.cos(a)*r;positions[i*3+1]=y;positions[i*3+2]=planet.position.z+Math.sin(a)*r;
  orbitRadius[i]=r;orbitAngles[i]=a;orbitSpeed[i]=(.005+(1/r)*.04)*(.8+Math.random()*.4);
}
geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));
const particleSystem=new THREE.Points(geometry,new THREE.PointsMaterial({size:.45,map:createParticleTexture(),transparent:true,opacity:.85,depthWrite:false,blending:THREE.AdditiveBlending}));
particleSystem.rotation.z=THREE.MathUtils.degToRad(8);particleSystem.rotation.x=THREE.MathUtils.degToRad(12);
scene.add(particleSystem);
let loginOn=true;
function animate(){
  requestAnimationFrame(animate);
  if(!loginOn)return;
  const p=particleSystem.geometry.attributes.position.array;
  for(let i=0;i<particleCount;i++){
    orbitAngles[i]+=orbitSpeed[i]*.6;const r=orbitRadius[i];
    p[i*3]=planet.position.x+Math.cos(orbitAngles[i])*r;p[i*3+2]=planet.position.z+Math.sin(orbitAngles[i])*r;
  }
  particleSystem.geometry.attributes.position.needsUpdate=true;
  planet.rotation.y+=.002;
  renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;updateCameraPosition();camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

/* ============ GLOBO INTERATIVO (card Hoje) ============ */
let globe=null;
function mountGlobe(){
  const el=document.getElementById('globe');if(!el||!window.THREE)return;
  if(globe){globe.stop=true}
  const w=el.clientWidth||260,h=el.clientHeight||230;
  const r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setSize(w,h);r.setPixelRatio(Math.min(devicePixelRatio,2));el.appendChild(r.domElement);
  const s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,w/h,.1,100);cam.position.z=7;
  const n=1800,pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){const u=Math.acos(2*Math.random()-1),v=Math.random()*Math.PI*2;pos[i*3]=2.1*Math.sin(u)*Math.cos(v);pos[i*3+1]=2.1*Math.cos(u);pos[i*3+2]=2.1*Math.sin(u)*Math.sin(v)}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const pts=new THREE.Points(g,new THREE.PointsMaterial({size:.07,map:createParticleTexture(),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
  pts.rotation.z=.3;s.add(pts);
  const st={stop:false,drag:false,lx:0,ly:0,vx:.004,vy:0};
  el.onpointerdown=e=>{st.drag=true;st.lx=e.clientX;st.ly=e.clientY;el.style.cursor='grabbing'};
  addEventListener('pointerup',()=>{st.drag=false;el.style.cursor='grab'});
  el.onpointermove=e=>{if(!st.drag)return;pts.rotation.y+=(e.clientX-st.lx)*.01;pts.rotation.x+=(e.clientY-st.ly)*.01;st.lx=e.clientX;st.ly=e.clientY};
  (function loop(){if(st.stop||!el.isConnected)return;requestAnimationFrame(loop);if(!st.drag)pts.rotation.y+=st.vx;r.render(s,cam)})();
  globe=st;
}

/* ============ UTILITÁRIOS ============ */
const $=(s,r=document)=>r.querySelector(s);
const iso=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const TODAY=()=>iso();
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const mark=()=>{db.days[TODAY()]=true};
const dateLabel=()=>new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const weekDays=()=>{const d=new Date(),k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return[...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return iso(x)})};
const sum=(a)=>a.reduce((s,x)=>s+x.v,0);
const net=d=>sum(db.tx.filter(t=>t.d===d&&t.type==='in'))-sum(db.tx.filter(t=>t.d===d&&t.type!=='in'));
const todayTasks=()=>db.tasks.filter(t=>t.d===TODAY()||(!t.done&&t.d<TODAY()));
const taskPct=()=>{const t=todayTasks();return t.length?Math.round(t.filter(x=>x.done).length/t.length*100):0};
const dailyGoals=()=>db.goals.filter(g=>g.kind==='dia');
const goalsDone=()=>dailyGoals().filter(g=>g.last===TODAY()).length;
const sleepMin=s=>{const[a,b]=s.bed.split(':').map(Number),[c,d]=s.wake.split(':').map(Number);let m=(c*60+d)-(a*60+b);if(m<=0)m+=1440;return m};
const hm=m=>Math.floor(m/60)+'h '+String(Math.round(m%60)).padStart(2,'0')+'min';
const streak=()=>{let n=0;const d=new Date();if(!db.days[iso(d)])d.setDate(d.getDate()-1);while(db.days[iso(d)]){n++;d.setDate(d.getDate()-1)}return n};

/* ============ ABAS ============ */
const TABS=[['hoje','🏠','Hoje'],['uber','🚗','Uber & 99'],['metas','🎯','Metas'],['treino','💪','Treino'],['tarefas','📅','Tarefas'],['sono','💤','Sono'],['progresso','📈','Progresso']];
let tab='hoje';
const empt=t=>`<p class="empty">${t}</p>`;
const del=(col,id)=>`<button class="x" data-del="${col}:${id}" aria-label="Remover">✕</button>`;

const V={
hoje(){
  const p=taskPct(),r=net(TODAY()),gd=dailyGoals();
  return `<div class="grid">
  <div class="c s12 hero"><div><h2>Um passo de cada vez.</h2><p>Organize suas prioridades, acompanhe seu ritmo e mantenha o que importa em movimento.</p></div><div id="globe" aria-label="Globo interativo"></div></div>
  <div class="c s4"><h3>Conclusão do dia</h3><div class="big">${p}%</div><div class="bar"><i style="width:${p}%"></i></div></div>
  <div class="c s4"><h3>Resultado financeiro</h3><div class="big ${r>0?'pos':r<0?'neg':''}">${brl(r)}</div><div class="sub">Entradas menos gastos de hoje</div></div>
  <div class="c s4"><h3>Metas concluídas</h3><div class="big">${goalsDone()}/${gd.length}</div><div class="sub">metas diárias hoje</div></div>
  <div class="c s12"><h3>Acesso rápido</h3><div class="row" style="justify-content:flex-start;flex-wrap:wrap">
  ${[['uber','🚗 Lançar corrida'],['tarefas','📅 Nova tarefa'],['treino','💪 Registrar treino'],['sono','💤 Registrar sono']].map(a=>`<button class="btn" style="flex:0 0 auto;background:var(--panel2);color:var(--tx)" data-go="${a[0]}">${a[1]}</button>`).join('')}</div></div></div>`},
uber(){
  const d=TODAY(),ent=sum(db.tx.filter(t=>t.d===d&&t.type==='in')),gas=sum(db.tx.filter(t=>t.d===d&&t.type!=='in')),wk=weekDays();
  const vals=wk.map(x=>sum(db.tx.filter(t=>t.d===x&&t.type==='in'))),mx=Math.max(...vals,1);
  const L={in:'Entrada',fuel:'Combustível',maint:'Manutenção',other:'Outros gastos'};
  const cat=['fuel','maint','other'].map(k=>[L[k],sum(db.tx.filter(t=>t.type===k))]),tot=cat.reduce((s,x)=>s+x[1],0);
  const hist=[...db.tx].reverse().slice(0,30);
  return `<div class="grid">
  <div class="c s4"><h3>Entradas hoje</h3><div class="big pos">${brl(ent)}</div></div>
  <div class="c s4"><h3>Gastos hoje</h3><div class="big neg">${brl(gas)}</div></div>
  <div class="c s4"><h3>Saldo líquido hoje</h3><div class="big">${brl(ent-gas)}</div></div>
  <div class="c s8"><h3>Entradas na semana</h3><div class="chart">${vals.map((v,i)=>`<div><i style="height:${v/mx*100}%"></i>${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'][i]}</div>`).join('')}</div></div>
  <form class="c s4" data-form="tx"><h3>Lançar valor</h3>
   <div class="f"><label>Tipo</label><select name="type">${Object.entries(L).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
   <div class="f"><label>Descrição</label><input name="desc" placeholder="Corrida Uber, gasolina, troca de óleo…" required></div>
   <div class="f"><label>Valor (R$)</label><input name="v" type="number" step="0.01" min="0.01" placeholder="0,00" required></div>
   <button class="btn">Salvar lançamento</button></form>
  <div class="c s8"><h3>Histórico</h3><div class="list">${hist.length?hist.map(t=>`<div class="it"><div class="g">${esc(t.desc)}<small>${L[t.type]} · ${t.d.split('-').reverse().join('/')}</small></div><b class="${t.type==='in'?'pos':'neg'}">${t.type==='in'?'+':'−'}${brl(t.v)}</b>${del('tx',t.id)}</div>`).join(''):empt('Nenhum lançamento ainda.')}</div></div>
  <div class="c s4"><h3>Para onde o dinheiro vai</h3>${tot?cat.map(c=>`<div class="hb"><span>${c[0]}</span><div class="bar"><i style="width:${c[1]/tot*100}%"></i></div><span>${brl(c[1])}</span></div>`).join(''):empt('Nenhum gasto registrado.')}</div></div>`},
metas(){
  const row=g=>g.kind==='dia'
   ?`<div class="it"><button class="chk ${g.last===TODAY()?'on':''}" data-goal="${g.id}">${g.last===TODAY()?'✓':''}</button><div class="g ${g.last===TODAY()?'done':''}">${esc(g.text)}</div>${del('goals',g.id)}</div>`
   :`<div class="it"><div class="g">${esc(g.text)}<small>${g.pct||0}% concluído</small><input type="range" min="0" max="100" step="5" value="${g.pct||0}" data-pct="${g.id}" style="margin-top:8px"></div>${del('goals',g.id)}</div>`;
  const dg=db.goals.filter(g=>g.kind==='dia'),lg=db.goals.filter(g=>g.kind==='longo');
  return `<div class="grid"><form class="c s4" data-form="goal"><h3>Nova meta</h3>
   <div class="f"><label>Tipo</label><select name="kind"><option value="dia">Meta diária</option><option value="longo">Objetivo de longo prazo</option></select></div>
   <div class="f"><label>Descrição</label><input name="text" placeholder="Ex.: Ler 5 páginas" required></div><button class="btn">Adicionar</button></form>
  <div class="c s8"><h3>Metas de hoje</h3><div class="list">${dg.length?dg.map(row).join(''):empt('Crie sua primeira meta diária.')}</div></div>
  <div class="c s12"><h3>Objetivos de longo prazo</h3><div class="list">${lg.length?lg.map(row).join(''):empt('Defina onde quer chegar nos próximos meses.')}</div></div></div>`},
treino(){
  const by={A:[],B:[],C:[]};db.workouts.forEach(w=>by[w.div].push(w));
  return `<div class="grid"><form class="c s4" data-form="wk"><h3>Registrar exercício</h3>
   <div class="f"><label>Divisão</label><select name="div"><option>A</option><option>B</option><option>C</option></select></div>
   <div class="f"><label>Exercício</label><input name="ex" placeholder="Supino reto" required></div>
   <div class="row f"><div><label>Séries</label><input name="sets" type="number" min="1" placeholder="4" required></div><div><label>Reps</label><input name="reps" type="number" min="1" placeholder="10" required></div><div><label>Carga (kg)</label><input name="kg" type="number" min="0" step="0.5" placeholder="40" required></div></div>
   <button class="btn">Registrar</button></form>
  <div class="c s8"><h3>Histórico por divisão</h3>${['A','B','C'].map(k=>`<div style="margin-bottom:14px"><b style="font-size:.9rem">Treino ${k}</b><div class="list">${by[k].length?[...by[k]].reverse().slice(0,12).map(w=>`<div class="it"><div class="g">${esc(w.ex)}<small>${w.sets}×${w.reps} · ${w.kg} kg · ${w.d.split('-').reverse().join('/')}</small></div>${del('workouts',w.id)}</div>`).join(''):empt('Nenhum exercício registrado.')}</div></div>`).join('')}</div></div>`},
tarefas(){
  const o={Alta:0,Média:1,Baixa:2},ts=[...db.tasks].sort((a,b)=>a.done-b.done||o[a.pr]-o[b.pr]);
  return `<div class="grid"><form class="c s4" data-form="task"><h3>Nova tarefa</h3>
   <div class="f"><label>Tarefa</label><input name="text" placeholder="O que precisa ser feito?" required></div>
   <div class="f"><label>Prioridade</label><select name="pr"><option>Alta</option><option selected>Média</option><option>Baixa</option></select></div><button class="btn">Adicionar</button></form>
  <div class="c s8"><h3>Pendências e prioridades · ${taskPct()}% concluído hoje</h3><div class="list">${ts.length?ts.map(t=>`<div class="it"><button class="chk ${t.done?'on':''}" data-task="${t.id}">${t.done?'✓':''}</button><div class="g ${t.done?'done':''}">${esc(t.text)}</div><span class="tag ${t.pr}">${t.pr}</span>${del('tasks',t.id)}</div>`).join(''):empt('Nenhuma tarefa. Adicione a primeira.')}</div></div></div>`},
sono(){
  const l=db.sleep.slice(-7),avg=l.length?l.reduce((s,x)=>s+sleepMin(x),0)/l.length:0;
  return `<div class="grid"><form class="c s4" data-form="sleep"><h3>Registrar sono</h3>
   <div class="f"><label>Deitou</label><input name="bed" type="time" required></div><div class="f"><label>Acordou</label><input name="wake" type="time" required></div><button class="btn">Registrar</button></form>
  <div class="c s8"><h3>Média recente (7 noites)</h3><div class="big">${hm(avg)}</div><div class="sub">${avg&&avg<420?'Abaixo das 7h recomendadas.':avg?'Dentro da faixa recomendada.':'Registre sua primeira noite.'}</div></div>
  <div class="c s12"><h3>Histórico</h3><div class="list">${db.sleep.length?[...db.sleep].reverse().slice(0,14).map(s=>`<div class="it"><div class="g">${hm(sleepMin(s))}<small>${s.bed} → ${s.wake} · ${s.d.split('-').reverse().join('/')}</small></div>${del('sleep',s.id)}</div>`).join(''):empt('Nenhum sono registrado.')}</div></div></div>`},
progresso(){
  const now=new Date(),y=now.getFullYear(),start=new Date(y,0,1),doy=Math.floor((now-start)/864e5)+1,total=(y%4===0&&y%100)||y%400===0?366:365;
  const cells=[...Array(total)].map((_,i)=>{const d=new Date(y,0,i+1);return`<i class="${db.days[iso(d)]?'on':''} ${i+1===doy?'cur':''}" title="${iso(d)}"></i>`}).join('');
  const count=Object.keys(db.days).filter(k=>k.startsWith(y)).length;
  const sc=Math.round((taskPct()+(dailyGoals().length?goalsDone()/dailyGoals().length*100:0))/(dailyGoals().length?2:1));
  return `<div class="grid">
  <div class="c s3"><h3>Performance de hoje</h3><div class="big">${sc}%</div><div class="bar"><i style="width:${sc}%"></i></div></div>
  <div class="c s3"><h3>Sequência atual</h3><div class="big">${streak()}</div><div class="sub">dias seguidos</div></div>
  <div class="c s3"><h3>Dias ativos no ano</h3><div class="big">${count}</div><div class="sub">de ${total}</div></div>
  <div class="c s3"><h3>Dia do ano</h3><div class="big">${doy}</div><div class="sub">${Math.round(doy/total*100)}% do ano decorrido</div></div>
  <div class="c s12"><h3>Projeto 365 · cada quadrado é um dia com atividade registrada</h3><div class="cells">${cells}</div></div></div>`}
};

function renderNav(){
  $('#nav').innerHTML=`<div class="logo">NSC Life OS</div>`+TABS.map(t=>`<button class="nav ${t[0]===tab?'on':''}" data-go="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('')+`<div class="spacer"></div><div class="user"><b>${esc(user.name)}</b><button data-logout>Sair</button></div>`;
}
function render(){
  const greet=tab==='hoje'?`Olá, ${esc(user.name.split(' ')[0])}`:TABS.find(t=>t[0]===tab)[2];
  $('#view').innerHTML=`<div class="head"><h1>${greet}</h1><p>${dateLabel()}</p></div>`+V[tab]();
  renderNav();
  if(tab==='hoje')mountGlobe();
}

/* ============ EVENTOS ============ */
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');if(go){tab=go.dataset.go;render();return}
  if(e.target.closest('[data-logout]')){Auth.end().finally(()=>location.reload());return}
  const d=e.target.closest('[data-del]');
  if(d){const[c,id]=d.dataset.del.split(':');db[c]=db[c].filter(x=>x.id!==id);Store.save();render();return}
  const g=e.target.closest('[data-goal]');
  if(g){const x=db.goals.find(a=>a.id===g.dataset.goal);x.last=x.last===TODAY()?null:TODAY();if(x.last)mark();Store.save();render();return}
  const t=e.target.closest('[data-task]');
  if(t){const x=db.tasks.find(a=>a.id===t.dataset.task);x.done=!x.done;if(x.done)mark();Store.save();render()}
});
document.addEventListener('change',e=>{
  if(e.target.dataset.pct){db.goals.find(a=>a.id===e.target.dataset.pct).pct=+e.target.value;mark();Store.save();render()}
});
document.addEventListener('submit',e=>{
  const k=e.target.dataset.form;if(!k)return;
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),id=uid(),d=TODAY();
  if(k==='tx')db.tx.push({id,d,type:f.type,desc:f.desc.trim(),v:+f.v});
  if(k==='goal')db.goals.push({id,kind:f.kind,text:f.text.trim(),pct:0,last:null});
  if(k==='wk')db.workouts.push({id,d,div:f.div,ex:f.ex.trim(),sets:+f.sets,reps:+f.reps,kg:+f.kg});
  if(k==='task')db.tasks.push({id,d,text:f.text.trim(),pr:f.pr,done:false});
  if(k==='sleep')db.sleep.push({id,d,bed:f.bed,wake:f.wake});
  mark();Store.save();render();
});

/* ============ ENTRADA NO APP ============ */
function enter(u){
  user=u;Store.load();
  loginOn=false;
  $('#auth').style.display='none';container.style.display='none';
  $('#app').classList.add('on');
  render();
}
Auth.session().then(s=>{if(s&&s.email)enter(s)}).catch(e=>console.error('Falha ao restaurar sessão:',e));
</script>
</body>
</html>
